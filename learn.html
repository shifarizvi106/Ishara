<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding-bottom: 80px; }

    .learn-header {
      padding: 22px 22px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .learn-logo { font-size: 1.4rem; font-weight: 900; color: #d63384; }
    .learn-stats { font-size: 0.85rem; font-weight: 700; color: #a14a76; display: flex; gap: 12px; }

    /* ── Big centre folder ── */
    .big-folder-wrap {
  display: flex;
  min-height: calc(100vh - 160px);
  position: relative;
}

.big-folder {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 180px;
  height: 144px;
  cursor: pointer;
  flex-shrink: 0;
}

    .big-folder .folder-back {
      position: absolute; inset: 0;
      background: #e8629a;
      border-radius: 0 16px 16px 16px;
    }
    .big-folder .folder-back::before {
      content: '';
      position: absolute;
      bottom: 100%; left: 0;
      width: 52px; height: 16px;
      background: #e8629a;
      border-radius: 8px 8px 0 0;
    }
    .big-folder .folder-front {
      position: absolute; inset: 0;
      background: #ff5fa2;
      border-radius: 8px 16px 16px 16px;
      z-index: 3;
      transform-origin: bottom;
      transition: all 0.3s ease-in-out;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .big-folder .folder-front.right { display: block; background: #ff5fa2; }

    /* ── Category papers fanned out ── */
    .cat-paper {
      position: absolute;
      width: 88px; height: 110px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(255,95,162,0.2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(.4,2,.4,1);
      z-index: 4;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(0.4);
      left: 50%; top: 50%;
      pointer-events: none;
      border: 2px solid #f4b6d2;
    }
    .cat-paper .cat-name {
      font-size: 0.65rem; font-weight: 800;
      color: #d63384; text-align: center;
      line-height: 1.2;
    }
    .cat-paper.done { background: #fff0f6; border-color: #ff5fa2; }
    .cat-paper.locked { opacity: 0.4 !important; cursor: default; }

    /* Fanned positions when open */
    .big-folder-wrap.open .cat-paper {
      pointer-events: all;
      visibility: visible;
    }

    .big-folder-wrap.open .cat-paper:nth-child(1) {
      opacity: 1;
      transform: translate(calc(-50% - 160px), calc(-50% - 60px)) rotateZ(-18deg);
    }
    .big-folder-wrap.open .cat-paper:nth-child(2) {
      opacity: 1;
      transform: translate(calc(-50% - 80px), calc(-50% - 110px)) rotateZ(-8deg);
    }
    .big-folder-wrap.open .cat-paper:nth-child(3) {
      opacity: 1;
      transform: translate(-50%, calc(-50% - 130px)) rotateZ(0deg);
    }
    .big-folder-wrap.open .cat-paper:nth-child(4) {
      opacity: 1;
      transform: translate(calc(-50% + 80px), calc(-50% - 110px)) rotateZ(8deg);
    }
    .big-folder-wrap.open .cat-paper:nth-child(5) {
      opacity: 1;
      transform: translate(calc(-50% + 160px), calc(-50% - 60px)) rotateZ(18deg);
    }

    /* Hover on individual paper */
    .big-folder-wrap.open .cat-paper:nth-child(1):hover { transform: translate(calc(-50% - 160px), calc(-50% - 75px)) rotateZ(-18deg) scale(1.08); }
    .big-folder-wrap.open .cat-paper:nth-child(2):hover { transform: translate(calc(-50% - 80px), calc(-50% - 125px)) rotateZ(-8deg) scale(1.08); }
    .big-folder-wrap.open .cat-paper:nth-child(3):hover { transform: translate(-50%, calc(-50% - 145px)) rotateZ(0deg) scale(1.08); }
    .big-folder-wrap.open .cat-paper:nth-child(4):hover { transform: translate(calc(-50% + 80px), calc(-50% - 125px)) rotateZ(8deg) scale(1.08); }
    .big-folder-wrap.open .cat-paper:nth-child(5):hover { transform: translate(calc(-50% + 160px), calc(-50% - 75px)) rotateZ(18deg) scale(1.08); }

    /* Open folder front flap - REMOVED, folder is static */

    .folder-hint {
      position: absolute;
      bottom: calc(50% - 110px);
      font-size: 0.78rem; font-weight: 700; color: #c77aa0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .big-folder-wrap.open .folder-hint { opacity: 0; }

    #toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%);
      background: #3a2a33; color: white;
      padding: 10px 22px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 700;
      opacity: 0; transition: opacity 0.3s; z-index: 99;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="learn-header">
  <div class="learn-logo">SignPath</div>
  <div class="learn-stats">
    <span id="starsDisplay">★ 0</span>
    <span id="streakDisplay">ϟ 0</span>
  </div>
</div>

<div class="big-folder-wrap" id="folderWrap">

  <!-- Category papers (hidden until open) -->
  <!-- built by JS -->

  <!-- The big folder -->
  <div class="big-folder" id="bigFolder" onclick="toggleFolder()">
    <div class="folder-back"></div>
    <div class="folder-front"></div>
    <div class="folder-front right"></div>
  </div>

  <div class="folder-hint">Tap to open lessons</div>
</div>

<div id="toast"></div>

<div style="display:flex; justify-content:center; padding: 0 22px 16px;">
  <a href="collect.html" style="
    display:block; width:100%; max-width:340px; text-align:center;
    background: linear-gradient(135deg, #ff5fa2, #d63384);
    color:white; font-size:0.9rem; font-weight:800;
    padding:14px; border-radius:999px; text-decoration:none;
    box-shadow: 0 6px 20px rgba(255,95,162,0.3);
  "> Practice Mode</a>
</div>

<nav class="bottom-nav">
  <div class="nav active">Learn</div>
  <div class="nav" onclick="location.href='progress.html'">Progress</div>
  <div class="nav" onclick="location.href='profile.html'">Profile</div>
</nav>

<script>
const CATEGORIES = [
  { id:'greetings', label:'Greetings',  emoji:'(^.^)/' },
  { id:'relations', label:'Relations',  emoji:'જ⁀➴ ♡' },
  { id:'emotions',  label:'Emotions',   emoji:'( •̀ - •́ )' },
  { id:'general',   label:'General',    emoji:'➤' },
  { id:'abc',       label:'ABC',        emoji:'ABC' },
];

function getCompleted() {
  try { return JSON.parse(localStorage.getItem('sp_completed') || '[]'); } catch(e) { return []; }
}

let isOpen = false;
const wrap = document.getElementById('folderWrap');
const bigFolder = document.getElementById('bigFolder');

// Update stats
document.getElementById('starsDisplay').textContent  = '★ ' + (localStorage.getItem('sp_stars')  || 0);
document.getElementById('streakDisplay').textContent = 'ϟ ' + (localStorage.getItem('sp_streak') || 0);

// Build category papers
const completed = getCompleted();
CATEGORIES.forEach((cat, i) => {
  const isDone     = completed.includes(cat.id);
  const isUnlocked = i === 0 || completed.includes(CATEGORIES[i-1].id);

  const paper = document.createElement('div');
  paper.className = 'cat-paper' + (isDone ? ' done' : '') + (!isUnlocked ? ' locked' : '');
  paper.innerHTML = `
    <span>${cat.emoji}</span>
    <span class="cat-name">${cat.label}</span>
    ${isDone ? '<span style="font-size:0.6rem;color:#ff5fa2">✓ done</span>' : ''}
  `;

  if (isUnlocked) {
    paper.onclick = (e) => {
      e.stopPropagation();
      paper.style.transform = paper.style.transform + ' scale(0.92)';
      setTimeout(() => {
        window.location.href = `lesson.html?cat=${cat.id}${isDone ? '&replay=1' : ''}`;
      }, 150);
    };
  } else {
    paper.onclick = (e) => {
      e.stopPropagation();
      showToast(`Complete ${CATEGORIES[i-1].label} first!`);
    };
  }

  // Insert before the big folder element
  wrap.insertBefore(paper, bigFolder);
});

function toggleFolder() {
  isOpen = !isOpen;
  wrap.classList.toggle('open', isOpen);
}

// Close if clicking outside
document.addEventListener('click', e => {
  if (isOpen && !wrap.contains(e.target)) {
    isOpen = false;
    wrap.classList.remove('open');
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}
</script>
</body>
</html>
