<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara - Learn</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    /* ====== SINGLE PROFILE CARD (MATCHING SCREENSHOT) ====== */
    .guest-profile-card {
      background: #ffe6f2;
      border-radius: 24px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }

    .guest-avatar {
      width: 64px;
      height: 64px;
      background: #ec4899;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
      margin-bottom: 8px;
    }

    .guest-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 16px;
    }

    .guest-stats-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .guest-stat-box {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .guest-stat-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #d63384;
      line-height: 1;
      margin-bottom: 4px;
    }

    .guest-stat-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #a14a76;
    }

    /* Toast Alert Message */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #3a2a33;
      color: white;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- ====== COMBINED USER/GUEST PROFILE CARD ====== -->
    <header class="guest-profile-card">
      <div class="guest-avatar" id="user-avatar">?</div>
      <div class="guest-name" id="user-name">Guest</div>

      <div class="guest-stats-row">
        <div class="guest-stat-box">
          <span class="guest-stat-value" id="starsDisplay">0</span>
          <span class="guest-stat-label">★ stars</span>
        </div>
        <div class="guest-stat-box">
          <span class="guest-stat-value" id="learnedDisplay">0</span>
          <span class="guest-stat-label">signs learned</span>
        </div>
        <div class="guest-stat-box">
          <span class="guest-stat-value" id="streakDisplay">0</span>
          <span class="guest-stat-label"> streak</span>
        </div>
      </div>
    </header>

    <!-- ====== COURSE DROPDOWN SELECTOR ====== -->
    <section class="course-selector-card">
      <label for="course-select" class="course-label">Select Course</label>
      <select id="course-select" class="course-dropdown">
        <option value="greetings">#1 : Greetings</option>
        <option value="relations">#2 : Relationships</option>
        <option value="emotions">#3 : Emotions</option>
        <option value="general">#4 : General</option>
        <option value="abc">#5 : ABC Basics</option>
      </select>
    </section>

    <!-- ====== OVERALL COURSE PROGRESS CARD ====== -->
    <section class="progress-card">
      <div class="progress-info">
        <span class="progress-title">Overall Progress</span>
        <span class="progress-percentage" id="progress-text">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- ====== PRACTICE MODE CARD ====== -->
    <section class="practice-mode-card">
      <div class="practice-text">
        <h3>Practice Mode</h3>
        <p>Review learned signs and test your speed.</p>
      </div>
      <a href="collect.html" class="practice-btn">Start Practice</a>
    </section>

    <!-- ====== DYNAMIC LESSON PATH GRID ====== -->
    <main class="learn">
      <div class="path" id="lessonPath">
        <!-- Built Dynamically via JavaScript -->
      </div>
    </main>

  </div>

  <!-- Toast Container -->
  <div id="toast"></div>

  <!-- ====== BOTTOM NAVIGATION ====== -->
  <nav class="bottom-nav">
    <a href="learn.html" class="nav active">Learn</a>
    <a href="progress.html" class="nav">Progress</a>
    <a href="profile.html" class="nav">Profile</a>
  </nav>

  <!-- ====== DASHBOARD & SUPABASE LOGIC ====== -->
  <script>
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = [
      { id: 'greetings', label: '#1 : Greetings',   name: 'Greetings' },
      { id: 'relations', label: '#2 : Relations',   name: 'Relationships' },
      { id: 'emotions',  label: '#3 : Emotions',    name: 'Emotions' },
      { id: 'general',   label: '#4 : General',     name: 'General' },
      { id: 'abc',       label: '#5 : ABC',         name: 'ABC Basics' },
    ];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2000);
    }

    async function initDashboard() {
      const { data: { session } } = await _supabase.auth.getSession();
      
      let completedCategories = [];
      let stars = 0;
      let streak = 0;

      if (session) {
        // User is Logged In
        const user = session.user;
        const displayName = user.user_metadata?.full_name || user.email?.split('@')[0] || 'Learner';
        
        document.getElementById('user-name').textContent = displayName;
        document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

        // Fetch User Profile Stats
        const { data: profile } = await _supabase
          .from('profiles')
          .select('stars, streak')
          .eq('id', user.id)
          .single();

        if (profile) {
          stars = profile.stars ?? 0;
          streak = profile.streak ?? 0;
        }

        // Fetch User Progress
        const { data: progressData } = await _supabase
          .from('user_progress')
          .select('category_id')
          .eq('user_id', user.id);

        if (progressData) {
          completedCategories = progressData.map(item => item.category_id);
        }
      } else {
        // User is NOT Signed In -> Stay as Guest with ? Avatar
        document.getElementById('user-name').textContent = 'Guest';
        document.getElementById('user-avatar').textContent = '?';
      }

      // Update Card Stats
      document.getElementById('starsDisplay').textContent = stars;
      document.getElementById('learnedDisplay').textContent = completedCategories.length;
      document.getElementById('streakDisplay').textContent = streak;

      // Update Progress Bar
      const percent = Math.round((completedCategories.length / CATEGORIES.length) * 100);
      document.getElementById('progress-text').textContent = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      // Render Lesson Path
      renderNodes(completedCategories);
    }

    function renderNodes(completed) {
      const pathContainer = document.getElementById('lessonPath');
      pathContainer.innerHTML = '';

      CATEGORIES.forEach((cat, index) => {
        const isDone = completed.includes(cat.id);
        const isUnlocked = index === 0 || completed.includes(CATEGORIES[index - 1].id);

        const node = document.createElement('div');

        if (isUnlocked) {
          node.className = `node active ${isDone ? 'done' : ''}`;
          node.innerHTML = `
            <span class="node-number">${index + 1}</span>
            <span class="label">${cat.name} ${isDone ? '(Done)' : ''}</span>
          `;
          node.onclick = () => {
            window.location.href = `lesson.html?cat=${cat.id}${isDone ? '&replay=1' : ''}`;
          };
        } else {
          node.className = 'node locked';
          node.innerHTML = `
            <span class="node-number">${index + 1}</span>
            <span class="label">${cat.name}</span>
          `;
          node.onclick = () => {
            showToast(`Complete ${CATEGORIES[index - 1].name} first!`);
          };
        }

        pathContainer.appendChild(node);
      });
    }

    document.getElementById('course-select').addEventListener('change', async (e) => {
      const catId = e.target.value;
      const { data: { session } } = await _supabase.auth.getSession();
      
      let completed = [];
      if (session) {
        const { data } = await _supabase
          .from('user_progress')
          .select('category_id')
          .eq('user_id', session.user.id);
        if (data) completed = data.map(item => item.category_id);
      }

      const index = CATEGORIES.findIndex(c => c.id === catId);
      const isUnlocked = index === 0 || completed.includes(CATEGORIES[index - 1].id);
      const isDone = completed.includes(catId);

      if (isUnlocked) {
        window.location.href = `lesson.html?cat=${catId}${isDone ? '&replay=1' : ''}`;
      } else {
        showToast(`Complete ${CATEGORIES[index - 1].name} first!`);
      }
    });

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
