<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara – Learn</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #2563eb;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar Navigation ── */
    .sidebar {
      width: 240px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      padding: 0 8px 24px 8px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item button {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      background: none;
      border: none;
      border-radius: var(--radius);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav-item.active button, .nav-item button:hover {
      background: var(--bg-body);
      color: var(--text-main);
    }

    .user-profile {
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ── Main Workarea ── */
    .main-content {
      flex: 1;
      padding: 40px;
      max-width: 960px;
    }

    /* ── Views Layout ── */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* ── Dashboard Cards & Tables ── */
    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: var(--bg-body);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-pill.completed { background: #e2e8f0; color: #0f172a; }
    .status-pill.available { background: #eff6ff; color: #2563eb; }

    /* ── Clean Lesson Stage ── */
    .lesson-stage {
      max-width: 480px;
      margin: 40px auto 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    .lesson-progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .lesson-progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.2s ease;
    }

    .sign-meta {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sign-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .media-box {
      width: 100%;
      height: 240px;
      background: var(--bg-body);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sign-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ── SaaS Buttons ── */
    .btn {
      display: inline-block;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-full { width: 100%; text-align: center; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand">Ishara</div>
      <ul class="nav-list">
        <li class="nav-item active" id="navDash"><button onclick="showDashboard()">Dashboard</button></li>
      </ul>
    </div>
    <div class="user-profile" id="userEmail">Loading session...</div>
  </aside>

  <main class="main-content">

    <section id="dashboardView" class="view-section active">
      <h1 class="page-title">Overview</h1>
      
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Modules Completed</div>
          <div class="stat-value" id="statCompleted">0 / 5</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Signs Learnt</div>
          <div class="stat-value" id="statSigns">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Streak</div>
          <div class="stat-value" id="statStreak">0 days</div>
        </div>
      </div>

      <h2 class="page-title" style="font-size: 1.1rem; margin-bottom: 16px;">Curriculum</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Module</th>
              <th>Signs</th>
              <th>Status</th>
              <th style="text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="moduleTable">
            </tbody>
        </table>
      </div>
    </section>

    <section id="lessonView" class="view-section">
      <button class="btn btn-secondary" onclick="showDashboard()" style="margin-bottom: 24px;">← Back to Overview</button>
      
      <div class="lesson-stage">
        <div class="lesson-progress-bar">
          <div class="lesson-progress-fill" id="lessonProgress"></div>
        </div>
        
        <div class="sign-meta" id="lessonCategory">Category</div>
        <h2 class="sign-title" id="signWord">Word</h2>
        
        <div class="media-box" id="mediaBox">
          <span style="color: var(--text-muted); font-size: 0.85rem;">No Image Available</span>
        </div>

        <p class="sign-description" id="signDesc">Description of the sign will appear here.</p>
        
        <button class="btn btn-primary btn-full" id="nextBtn" onclick="nextSign()">Next Sign</button>
      </div>
    </section>

  </main>

  <script>
    // ── SUPABASE CONFIG ──
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── CURRICULUM DATA ──
    const MODULES = [
      { id: 'greetings', name: 'Greetings', signs: [
        { word: 'Hello', img: 'assets/hello.gif', desc: 'Raise hand to forehead with flat fingers in a salute motion.' },
        { word: 'Thank You', img: 'assets/thankyou.gif', desc: 'Touch fingers to chin, then extend hand forward towards the receiver.' }
      ]},
      { id: 'relations', name: 'Relationships', signs: [
        { word: 'Mother', desc: 'Touch index finger to your nose.' },
        { word: 'Father', desc: 'Twirl index finger near mustache area.' },
        { word: 'Friend', desc: 'Hook index fingers together gently.' }
      ]},
      { id: 'emotions', name: 'Emotions', signs: [
        { word: 'Happy', desc: 'Sweep open palm upwards along chest.' },
        { word: 'Sad', desc: 'Move open palm downwards over face.' }
      ]},
      { id: 'general', name: 'General', signs: [
        { word: 'Yes', desc: 'Nod closed fist up and down.' },
        { word: 'No', desc: 'Snap index and middle finger to thumb.' }
      ]},
      { id: 'abc', name: 'ABC Basics', signs: [
        { word: 'A', img: 'assets/a.png', desc: 'Fist with thumb resting against index finger.' },
        { word: 'B', img: 'assets/b.png', desc: 'Flat palm up, thumb tucked across.' }
      ]}
    ];

    // ── STATE ──
    let currentUser = null;
    let completedCategoryIds = [];
    let currentModule = null;
    let currentStep = 0;

    // ── INIT ──
    async function init() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        document.getElementById('userEmail').innerText = currentUser.email;
        await fetchUserProgress();
      } else {
        document.getElementById('userEmail').innerText = 'Guest Mode';
      }
      renderDashboard();
    }

    // ── SUPABASE SYNC ──
    async function fetchUserProgress() {
      if (!currentUser) return;
      const { data, error } = await _supabase
        .from('user_progress')
        .select('category_id')
        .eq('user_id', currentUser.id);

      if (!error && data) {
        completedCategoryIds = data.map(row => row.category_id);
      }
    }

    async function recordCompletion(catId) {
      if (!currentUser || completedCategoryIds.includes(catId)) return;
      
      completedCategoryIds.push(catId);
      await _supabase.from('user_progress').insert({
        user_id: currentUser.id,
        category_id: catId,
        completed_at: new Date().toISOString()
      });
      renderDashboard();
    }

    // ── UI RENDERING ──
    function renderDashboard() {
      // Calculate Stats
      const doneCount = completedCategoryIds.length;
      document.getElementById('statCompleted').innerText = `${doneCount} / ${MODULES.length}`;
      
      let totalSignsLearnt = 0;
      MODULES.forEach(m => {
        if (completedCategoryIds.includes(m.id)) totalSignsLearnt += m.signs.length;
      });
      document.getElementById('statSigns').innerText = totalSignsLearnt;
      document.getElementById('statStreak').innerText = `${doneCount > 0 ? 1 : 0} days`;

      // Render Table
      const tbody = document.getElementById('moduleTable');
      tbody.innerHTML = '';
      
      MODULES.forEach(mod => {
        const isDone = completedCategoryIds.includes(mod.id);
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
          <td style="font-weight: 600;">${mod.name}</td>
          <td>${mod.signs.length} signs</td>
          <td><span class="status-pill ${isDone ? 'completed' : 'available'}">${isDone ? 'Completed' : 'Available'}</span></td>
          <td style="text-align: right;">
            <button class="btn ${isDone ? 'btn-secondary' : 'btn-primary'}" onclick="startLesson('${mod.id}')">
              ${isDone ? 'Review' : 'Start'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showDashboard() {
      document.getElementById('dashboardView').classList.add('active');
      document.getElementById('lessonView').classList.remove('active');
      document.getElementById('navDash').classList.add('active');
      renderDashboard();
    }

    // ── LESSON ENGINE ──
    function startLesson(moduleId) {
      currentModule = MODULES.find(m => m.id === moduleId);
      currentStep = 0;
      
      document.getElementById('dashboardView').classList.remove('active');
      document.getElementById('lessonView').classList.add('active');
      document.getElementById('navDash').classList.remove('active');
      
      renderLessonStep();
    }

    function renderLessonStep() {
      const sign = currentModule.signs[currentStep];
      const total = currentModule.signs.length;

      // Update progress fill
      document.getElementById('lessonProgress').style.width = `${((currentStep + 1) / total) * 100}%`;
      
      // Update details
      document.getElementById('lessonCategory').innerText = currentModule.name;
      document.getElementById('signWord').innerText = sign.word;
      document.getElementById('signDesc').innerText = sign.desc;

      // Media Box
      const mediaBox = document.getElementById('mediaBox');
      if (sign.img) {
        mediaBox.innerHTML = `<img src="${sign.img}" alt="${sign.word}" onerror="this.parentNode.innerHTML='<span style=\\'color: var(--text-muted); font-size: 0.85rem;\\'>Image missing</span>'">`;
      } else {
        mediaBox.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">No Image Available</span>`;
      }

      // Next button text
      const nextBtn = document.getElementById('nextBtn');
      if (currentStep === total - 1) {
        nextBtn.innerText = 'Complete Module';
      } else {
        nextBtn.innerText = 'Next Sign';
      }
    }

    function nextSign() {
      const total = currentModule.signs.length;
      if (currentStep < total - 1) {
        currentStep++;
        renderLessonStep();
      } else {
        recordCompletion(currentModule.id);
        showDashboard();
      }
    }

    init();
  </script>
</body>
</html>
