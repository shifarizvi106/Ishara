<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignPath – Profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding-bottom: 80px; }
    .profile-page { padding: 24px 22px; }

    .profile-hero {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      margin-bottom: 28px; text-align: center;
    }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, #ff5fa2, #d63384);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: white; font-weight: 900;
      border: 3px solid #ff5fa2;
      box-shadow: 0 6px 20px rgba(255,95,162,0.25);
    }
    .display-name  { font-size: 1.3rem; font-weight: 900; color: #3a2a33; }
    .display-email { font-size: 0.78rem; color: #a14a76; }
    .guest-tag {
      background: #fff0f6; color: #d63384;
      border-radius: 999px; padding: 3px 12px;
      font-size: 0.72rem; font-weight: 700;
    }

    .stat-row {
      display: flex; gap: 10px; margin-bottom: 28px;
    }
    .stat-pill {
      flex: 1; background: white; border-radius: 20px;
      padding: 14px 10px; text-align: center;
      box-shadow: 0 4px 16px rgba(255,95,162,0.12);
    }
    .stat-pill .num { font-size: 1.6rem; font-weight: 900; color: #d63384; display: block; }
    .stat-pill .lbl { font-size: 0.68rem; color: #a14a76; font-weight: 600; display: block; }

    .section-title {
      font-size: 0.72rem; font-weight: 700; color: #c77aa0;
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
    }
    .action-list {
      background: white; border-radius: 20px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(255,95,162,0.1); margin-bottom: 16px;
    }
    .action-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; cursor: pointer;
      border-bottom: 1px solid #fff0f6;
      font-size: 0.9rem; font-weight: 700; color: #3a2a33;
      transition: background 0.15s;
    }
    .action-item:last-child { border-bottom: none; }
    .action-item:hover { background: #fff0f6; }
    .action-item.danger { color: #dc3545; }

    .signin-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff5fa2, #d63384);
      color: white; border: none; border-radius: 999px;
      padding: 15px; font-size: 1rem; font-weight: 800;
      cursor: pointer; box-shadow: 0 8px 24px rgba(255,95,162,0.3);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header class="top-bar">
  <span>Profile</span>
</header>

<div class="profile-page">

  <div class="profile-hero">
    <div class="avatar" id="avatarEl">?</div>
    <div class="display-name" id="displayName">Guest</div>
    <div class="display-email" id="displayEmail"></div>
    <div class="guest-tag" id="guestTag" style="display:none">Guest mode</div>
  </div>

  <div class="stat-row">
    <div class="stat-pill">
      <span class="num" id="starsEl">0</span>
      <span class="lbl">★ stars</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="signsEl">0</span>
      <span class="lbl">signs learned</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="streakEl">0</span>
      <span class="lbl">🔥 streak</span>
    </div>
  </div>

  <div id="guestSection" style="display:none">
    <button class="signin-btn" onclick="location.href='login.html'">
      Sign in to save progress
    </button>
  </div>

  <div id="accountSection" style="display:none">
    <div class="section-title">Account</div>
    <div class="action-list">
      <div class="action-item danger" onclick="signOut()">
        Sign out <span>→</span>
      </div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="nav" onclick="location.href='learn.html'">Learn</div>
  <div class="nav" onclick="location.href='progress.html'">Progress</div>
  <div class="nav active">Profile</div>
</nav>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://xxijjaiytnqrdbqjegjr.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8'
  );

  function getStats() {
    const completed = JSON.parse(localStorage.getItem('sp_completed') || '[]');
    const counts = { greetings:4, relations:5, emotions:5, general:5, abc:26 };
    return {
      stars:  parseInt(localStorage.getItem('sp_stars')  || '0'),
      streak: parseInt(localStorage.getItem('sp_streak') || '0'),
      signs:  completed.reduce((s,c) => s + (counts[c]||0), 0),
    };
  }

  const { data: { session } } = await supabase.auth.getSession();
  const stats = getStats();

  document.getElementById('starsEl').textContent  = stats.stars;
  document.getElementById('streakEl').textContent = stats.streak;
  document.getElementById('signsEl').textContent  = stats.signs;

  if (session) {
    const user = session.user;
    const name = user.user_metadata?.full_name || user.email.split('@')[0];
    document.getElementById('displayName').textContent  = name;
    document.getElementById('displayEmail').textContent = user.email;
    document.getElementById('avatarEl').textContent     = name[0].toUpperCase();
    document.getElementById('accountSection').style.display = 'block';
  } else {
    document.getElementById('guestTag').style.display     = 'block';
    document.getElementById('guestSection').style.display = 'block';
    document.getElementById('avatarEl').textContent = '(^.^)';
  }

  window.signOut = async () => {
    if (confirm('Sign out of SignPath?')) {
      await supabase.auth.signOut();
      localStorage.removeItem('sp_guest');
      window.location.href = 'login.html';
    }
  };
</script>
</body>
</html>
