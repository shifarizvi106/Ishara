<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara – Lesson</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #fff0f6;
      color: #1f2937;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .lesson-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 32px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #833a5c;
      cursor: pointer;
      font-weight: 800;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      background: #ffe6f2;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ff5fa2;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* ── Main Stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 100px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 20px rgba(255, 95, 162, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cat-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: #d63384;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .sign-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1f2937;
    }

    .sign-img-wrap {
      width: 200px;
      height: 200px;
      background: #fff0f6;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .sign-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
    }

    .fallback-emoji {
      font-size: 4.5rem;
    }

    .sign-desc {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.6;
      font-weight: 500;
    }

    .sign-tip {
      font-size: 0.85rem;
      color: #833a5c;
      font-style: italic;
      background: #fff0f6;
      padding: 10px 16px;
      border-radius: 12px;
      width: 100%;
    }

    /* ── Action Footer ── */
    .action-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 24px 32px;
      background: linear-gradient(to top, #fff0f6 70%, transparent);
      display: flex;
      justify-content: center;
    }

    .btn-primary {
      background: #ff5fa2;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 16px 0;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 12px rgba(255, 95, 162, 0.25);
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: #d63384;
    }

    /* ── Finish View ── */
    .finish-card {
      background: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(255, 95, 162, 0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .finish-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1f2937;
    }

    .finish-sub {
      color: #6b7280;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header class="lesson-header">
    <button class="close-btn" onclick="confirmExit()">✕</button>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <div class="action-wrap" id="actionWrap">
    <button class="btn-primary" id="actionBtn" onclick="nextStep()">Got it! Next Sign →</button>
  </div>

  <script>
    // SUPABASE SETUP
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // LESSON DATA
    const ALL_LESSONS = {
      greetings: {
        label: 'Greetings',
        signs: [
          { word: 'Hello', img: 'assets/hello.gif', desc: 'Raise your right hand to your forehead in a salute with fingers flat and together.', tip: 'Like a crisp salute towards the forehead.' },
          { word: 'Thank You', img: 'assets/thankyou.gif', desc: 'Touch your fingers to your chin, then move your hand forward and down toward the person.', tip: 'Similar to blowing a kiss from your chin.' },
          { word: 'How Are You', emoji: '🤝', desc: 'Point both index fingers toward each other at chest level and alternate them up and down.', tip: 'Expressive movement at chest height.' },
          { word: "I'm Fine", emoji: '😊', desc: 'Place your hand flat on your chest and push outward in a subtle downward arc.', tip: 'Smooth gesture outward from your heart.' }
        ]
      },
      relations: {
        label: 'Relationships',
        signs: [
          { word: 'Mother', emoji: '👩', desc: 'Touch your nose with your index finger in a single, clear motion.', tip: 'Signifying mother.' },
          { word: 'Father', emoji: '👨', desc: 'Twirl your mustache area with your index finger.', tip: 'Signifying father.' },
          { word: 'Sister', emoji: '👧', desc: 'Touch index finger to nose, then move fingertips away from your shoulder.', tip: 'Female relation gesture.' },
          { word: 'Brother', emoji: '👦', desc: 'Twirl mustache area, then move fingertips outward from your shoulder.', tip: 'Male relation gesture.' },
          { word: 'Friend', emoji: '🤝', desc: 'Hook your index fingers together gently.', tip: 'Interlocking fingers bond.' }
        ]
      },
      emotions: {
        label: 'Emotions',
        signs: [
          { word: 'Happy', emoji: '😊', desc: 'Open your hand and sweep it gently upward near your chest.', tip: 'Upward motion with a smile.' },
          { word: 'Sad', emoji: '😢', desc: 'Place open hand near face and move downward.', tip: 'Downward motion with expression.' },
          { word: 'Angry', emoji: '😠', desc: 'Form a claw hand shape in front of face with tension.', tip: 'Claw shape indicates intensity.' },
          { word: 'Love', emoji: '❤️', desc: 'Cross both arms comfortably over your chest.', tip: 'Universal embrace sign.' }
        ]
      },
      general: {
        label: 'General',
        signs: [
          { word: 'Yes', emoji: '✅', desc: 'Make a fist and nod it forward and down.', tip: 'Fist mimics head nodding.' },
          { word: 'No', emoji: '❌', desc: 'Snap index and middle finger closed against thumb.', tip: 'Quick, decisive motion.' },
          { word: 'Help', emoji: '🆘', desc: 'Place flat hand under opposite fist and lift together.', tip: 'Lifting hand supports the other.' },
          { word: 'Water', emoji: '💧', desc: 'Form W shape with fingers and tap index against chin.', tip: 'W shape at chin.' }
        ]
      },
      abc: {
        label: 'ABC Basics',
        signs: [
          { word: 'A', img: 'assets/a.png', emoji: '🅰️', desc: 'Form a fist with thumb resting against the side of index finger.', tip: 'Clean fist shape.' },
          { word: 'B', img: 'assets/b.png', emoji: '🅱️', desc: 'Open palm with four fingers straight up and thumb tucked across palm.', tip: 'Flat vertical fingers.' },
          { word: 'C', img: 'assets/c.png', emoji: '©️', desc: 'Curve fingers and thumb to form the letter C shape.', tip: 'Literal C hand shape.' },
          { word: 'D', img: 'assets/d.png', emoji: '🔵', desc: 'Point index finger straight up, remaining fingers touch thumb.', tip: 'Index finger vertical.' }
        ]
      }
    };

    // STATE
    const params = new URLSearchParams(window.location.search);
    const catId = params.get('cat') || 'greetings';
    const isReplay = params.get('replay') === '1';
    const lesson = ALL_LESSONS[catId] || ALL_LESSONS.greetings;
    const SIGNS = lesson.signs;

    let step = 0;

    // RENDER CARD
    function renderCard() {
      if (step >= SIGNS.length) {
        showFinish();
        return;
      }

      // Update Header Progress
      const percent = Math.round(((step + 1) / SIGNS.length) * 100);
      document.getElementById('progressFill').style.width = `${percent}%`;

      const sign = SIGNS[step];
      const stage = document.getElementById('stage');

      const imgHtml = sign.img
        ? `<div class="sign-img-wrap"><img class="sign-img" src="${sign.img}" alt="${sign.word}" onerror="this.style.display='none'"></div>`
        : `<div class="sign-img-wrap"><span class="fallback-emoji">${sign.emoji || '🖐️'}</span></div>`;

      stage.innerHTML = `
        <div class="card">
          <div class="cat-badge">${lesson.label} • ${step + 1} of ${SIGNS.length}</div>
          <h1 class="sign-name">${sign.word}</h1>
          ${imgHtml}
          <p class="sign-desc">${sign.desc}</p>
          ${sign.tip ? `<p class="sign-tip">Tip: ${sign.tip}</p>` : ''}
        </div>
      `;

      const isLast = step === SIGNS.length - 1;
      document.getElementById('actionBtn').textContent = isLast ? 'Complete Lesson ✓' : 'Did you get it? Next Sign →';
    }

    function nextStep() {
      step++;
      renderCard();
    }

    // SAVE PROGRESS TO SUPABASE
    async function saveCompletion() {
      if (isReplay) return;
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) return;

        await _supabase
          .from('user_progress')
          .upsert({
            user_id: session.user.id,
            category_id: catId,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id, category_id' });
      } catch (e) {
        console.error('Error saving progress:', e);
      }
    }

    // FINISH VIEW
    async function showFinish() {
      await saveCompletion();

      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('actionWrap').style.display = 'none';

      const stage = document.getElementById('stage');
      stage.innerHTML = `
        <div class="finish-card">
          <div style="font-size: 3rem;"></div>
          <h2 class="finish-title">Module Completed!</h2>
          <p class="finish-sub">You have reviewed all core signs in ${lesson.label}.</p>
          <a href="learn.html" class="btn-primary" style="text-decoration:none; text-align:center; display:block; margin-top:12px;">Return to Dashboard</a>
        </div>
      `;
    }

    function confirmExit() {
      if (confirm('Exit lesson?')) {
        window.location.href = 'learn.html';
      }
    }

    // INIT
    renderCard();
  </script>
</body>
</html>
