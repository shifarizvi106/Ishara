<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignPath – Lesson</title>
  <style>
    * { box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:0; }
    body {
      min-height:100vh;
      background:linear-gradient(180deg,#ffe3f1,#fde6f2);
      color:#3a2a33;
      display:flex; flex-direction:column;
    }

    /* ── Header ── */
    .lesson-header {
      display:flex; align-items:center; gap:12px;
      padding:18px 22px 12px;
    }
    .close-btn {
      background:none; border:none; font-size:1.3rem;
      color:#c77aa0; cursor:pointer; flex-shrink:0;
    }
    .progress-track {
      flex:1; height:14px; background:#f4b6d2;
      border-radius:999px; overflow:hidden;
    }
    .progress-fill {
      height:100%; width:0%;
      background:linear-gradient(90deg,#ff5fa2,#d63384);
      border-radius:999px;
      transition:width 0.5s cubic-bezier(.4,2,.6,1);
    }
    .lives-display { font-size:0.95rem; font-weight:800; flex-shrink:0; }

    /* ── Category badge ── */
    .cat-badge {
      text-align:center; padding:4px 0 0;
      font-size:0.72rem; font-weight:700;
      color:#c77aa0; text-transform:uppercase; letter-spacing:2px;
    }

    /* ── Stage ── */
    .stage {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:16px 20px 110px;
    }
    .card {
      width:100%; max-width:380px;
      display:flex; flex-direction:column;
      align-items:center; gap:14px;
      animation:slideIn 0.35s cubic-bezier(.4,2,.6,1);
    }
    @keyframes slideIn {
      from { opacity:0; transform:translateX(36px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .card.exit {
      animation:slideOut 0.22s ease-in forwards;
      pointer-events:none;
    }
    @keyframes slideOut {
      to { opacity:0; transform:translateX(-36px); }
    }

    /* ── Show phase ── */
    .phase-label {
      font-size:0.7rem; font-weight:700; color:#c77aa0;
      text-transform:uppercase; letter-spacing:2px;
    }
    .emoji-box {
      width:130px; height:130px; background:white;
      border-radius:28px;
      box-shadow:0 10px 32px rgba(255,95,162,0.2);
      display:flex; align-items:center; justify-content:center;
      font-size:5rem;
    }
    .sign-name {
      font-size:2rem; font-weight:900; color:#d63384;
    }
    .sign-desc {
      background:white; border-radius:18px;
      padding:14px 18px; width:100%;
      box-shadow:0 4px 16px rgba(255,95,162,0.1);
      font-size:0.88rem; color:#3a2a33;
      line-height:1.65; text-align:center;
    }
    .sign-tip {
      font-size:0.76rem; color:#a14a76;
      font-style:italic; text-align:center;
    }

    /* ── Sign image ── */
    .sign-img-wrap {
      width:220px; height:220px;
      background:white; border-radius:28px;
      box-shadow:0 10px 32px rgba(255,95,162,0.2);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; position:relative;
    }
    .sign-img {
      width:100%; height:100%; object-fit:contain;
      padding:10px;
    }
    /* Fallback emoji shown when no image */
    .sign-img-wrap .fallback {
      font-size:5rem;
    }

    /* Animation: wave (Hello) */
    .anim-wave {
      animation:wave 1.2s ease-in-out infinite;
      transform-origin:bottom center;
    }
    @keyframes wave {
      0%,100% { transform:rotate(-8deg); }
      50%     { transform:rotate(8deg); }
    }

    /* Animation: sweep (Thank You) */
    .anim-sweep {
      animation:sweep 1.6s ease-in-out infinite;
    }
    @keyframes sweep {
      0%,100% { transform:translate(0,0); }
      50%     { transform:translate(12px, 10px); }
    }

    /* Animation: pulse (static handshapes A-D) */
    .anim-pulse {
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); }
      50%     { transform:scale(1.06); }
    }

    /* Animation: fadein (default fallback) */
    .anim-fadein {
      animation:fadein 0.6s ease-out forwards;
    }
    @keyframes fadein {
      from { opacity:0; transform:scale(0.9); }
      to   { opacity:1; transform:scale(1); }
    }

    /* ── Quiz phase ── */
    .quiz-prompt {
      font-size:1rem; font-weight:700;
      color:#3a2a33; text-align:center; line-height:1.5;
    }
    .quiz-emoji {
      font-size:3.8rem; background:white;
      border-radius:22px; padding:14px 22px;
      box-shadow:0 6px 20px rgba(255,95,162,0.15);
    }
    .choices {
      display:grid; grid-template-columns:1fr 1fr;
      gap:10px; width:100%;
    }
    .choice-btn {
      background:white; border:2.5px solid #f4b6d2;
      border-radius:16px; padding:15px 10px;
      font-size:0.92rem; font-weight:700; color:#3a2a33;
      cursor:pointer; transition:border-color 0.15s;
      line-height:1.3;
    }
    .choice-btn:not(:disabled):hover { border-color:#ff5fa2; }
    .choice-btn.correct {
      background:#d4f5e2; border-color:#28a745; color:#155724;
      animation:pop 0.3s cubic-bezier(.4,2,.6,1);
    }
    .choice-btn.wrong {
      background:#fde8ec; border-color:#dc3545; color:#721c24;
      animation:shake 0.35s;
    }
    .choice-btn.reveal {
      background:#d4f5e2; border-color:#28a745; color:#155724;
    }
    .choice-btn:disabled { cursor:default; }
    @keyframes pop {
      0%,100% { transform:scale(1); }
      50%     { transform:scale(1.06); }
    }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25%     { transform:translateX(-7px); }
      75%     { transform:translateX(7px); }
    }

    /* ── Action button ── */
    .action-wrap {
      position:fixed; bottom:0; left:0; right:0;
      padding:16px 22px 28px;
      background:linear-gradient(to top,#fde6f2 55%,transparent);
      display:flex; justify-content:center;
    }
    .action-wrap button {
      background:linear-gradient(135deg,#ff5fa2,#d63384);
      color:white; border:none; border-radius:999px;
      padding:15px 0; font-size:1rem; font-weight:800;
      cursor:pointer; width:100%; max-width:340px;
      box-shadow:0 8px 24px rgba(255,95,162,0.35);
      transition:transform 0.12s;
    }
    .action-wrap button:active { transform:scale(0.97); }

    /* ── Feedback bar ── */
    .feedback-bar {
      position:fixed; bottom:0; left:0; right:0;
      padding:16px 22px 28px;
      display:flex; align-items:center; gap:12px;
      transform:translateY(100%);
      transition:transform 0.3s cubic-bezier(.4,2,.6,1);
      z-index:20;
    }
    .feedback-bar.show { transform:translateY(0); }
    .feedback-bar.ok  { background:#d4f5e2; }
    .feedback-bar.bad { background:#fde8ec; }
    .fb-icon  { font-size:1.8rem; }
    .fb-text  { flex:1; }
    .fb-title { font-size:0.95rem; font-weight:800; display:block; margin-bottom:2px; }
    .ok  .fb-title { color:#155724; }
    .bad .fb-title { color:#721c24; }
    .fb-sub   { font-size:0.78rem; color:#555; }
    .continue-btn {
      border:none; border-radius:999px;
      padding:11px 22px; font-size:0.88rem; font-weight:800;
      cursor:pointer; flex-shrink:0; color:white;
    }
    .ok  .continue-btn { background:#28a745; }
    .bad .continue-btn { background:#dc3545; }

    /* ── XP pop ── */
    .xp-pop {
      position:fixed; top:28%; left:50%;
      transform:translate(-50%,-50%) scale(0);
      background:linear-gradient(135deg,#ff5fa2,#d63384);
      color:white; font-size:1.8rem; font-weight:900;
      border-radius:20px; padding:14px 28px;
      box-shadow:0 16px 40px rgba(255,95,162,0.4);
      pointer-events:none; z-index:60;
      transition:transform 0.3s cubic-bezier(.4,2,.6,1),opacity 0.35s;
      opacity:0;
    }
    .xp-pop.show { transform:translate(-50%,-50%) scale(1); opacity:1; }

    /* ── Heart pop ── */
    .heart-pop {
      position:fixed; top:60px; right:22px;
      font-size:1.4rem; pointer-events:none; z-index:50;
      animation:heartUp 0.55s forwards;
    }
    @keyframes heartUp {
      to { opacity:0; transform:translateY(-28px) scale(0.6); }
    }

    /* ── Finish ── */
    .finish {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:16px; padding:32px 24px 40px; text-align:center;
    }
    .finish-emoji { font-size:5rem; animation:bounce 0.7s ease-in-out infinite alternate; }
    @keyframes bounce { to { transform:translateY(-14px); } }
    .finish-title { font-size:2rem; font-weight:900; color:#d63384; }
    .finish-sub   { color:#a14a76; line-height:1.6; }
    .xp-badge {
      background:linear-gradient(135deg,#ff5fa2,#d63384);
      color:white; border-radius:999px; padding:12px 28px;
      font-size:1.1rem; font-weight:900;
      box-shadow:0 8px 24px rgba(255,95,162,0.3);
    }
    .unlock-banner {
      background:white; border-radius:20px; padding:14px 20px;
      box-shadow:0 6px 20px rgba(255,95,162,0.15);
      font-size:0.9rem; color:#3a2a33; text-align:center;
      border:2px solid #f4b6d2;
    }
    .unlock-banner strong { color:#d63384; }
    .stat-row { display:flex; gap:10px; }
    .stat-box {
      background:white; border-radius:16px;
      padding:12px 16px; text-align:center;
      box-shadow:0 4px 14px rgba(255,95,162,0.1);
      min-width:80px;
    }
    .stat-num { font-size:1.4rem; font-weight:900; color:#d63384; }
    .stat-lbl { font-size:0.68rem; color:#a14a76; }
    .back-btn {
      background:white; border:2.5px solid #f4b6d2;
      color:#a14a76; border-radius:999px;
      padding:13px 36px; font-size:0.92rem; font-weight:800;
      cursor:pointer; text-decoration:none; display:inline-block;
    }
    .retry-btn {
      background:linear-gradient(135deg,#ff5fa2,#d63384);
      color:white; border:none; border-radius:999px;
      padding:13px 36px; font-size:0.92rem; font-weight:800;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="xp-pop" id="xpPop">+10 XP 🌟</div>

// ─────────────────────────────────────────────
// PARSE URL PARAMS
// ─────────────────────────────────────────────
const params  = new URLSearchParams(window.location.search);
const catId   = params.get('cat') || 'greetings';
const isReplay = params.get('replay') === '1';
const lesson  = ALL_LESSONS[catId] || ALL_LESSONS.greetings;
const SIGNS   = lesson.signs;

document.getElementById('catBadge').textContent = lesson.label;
document.title = `SignPath – ${lesson.label}`;

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let step     = 0;
let phase    = 'show';
let lives    = 5;
let correct  = 0;
let wrong    = 0;
let answered = false;
let actionWrap = null;

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderStep() {
  hideFeedback();
  answered = false;
  updateProgress();
  updateLives();

  if (step >= SIGNS.length) { showFinish(); return; }

  const sign  = SIGNS[step];
  const stage = document.getElementById('stage');
  const old   = stage.querySelector('.card');

  if (old) {
    old.classList.add('exit');
    setTimeout(() => { old.remove(); buildCard(sign, stage); }, 230);
  } else {
    buildCard(sign, stage);
  }
}

function buildCard(sign, stage) {
  phase === 'show' ? buildShow(sign, stage) : buildQuiz(sign, stage);
}

function buildShow(sign, stage) {
  const card = el('div','card');

  // Image or emoji fallback
  const imgHtml = sign.img
    ? `<div class="sign-img-wrap">
         <img class="sign-img ${sign.anim||'anim-fadein'}"
              src="${sign.img}"
              onerror="this.parentNode.innerHTML='<span class=\\'fallback\\'>${sign.emoji}</span>'"
              alt="${sign.word}">
       </div>`
    : `<div class="sign-img-wrap"><span class="fallback">${sign.emoji}</span></div>`;

  card.innerHTML = `
    <div class="phase-label">Learn this sign</div>
    ${imgHtml}
    <div class="sign-name">${sign.word}</div>
    <div class="sign-desc">${sign.desc}</div>
    <p class="sign-tip">💡 ${sign.tip}</p>
  `;
  stage.appendChild(card);
  showAction('Got it! ✓', () => { phase='quiz'; renderStep(); });
}

function buildQuiz(sign, stage) {
  const choices = makeChoices(sign.word);
  const card = el('div','card');
  card.innerHTML = `
    <div class="phase-label">What sign is this?</div>
    <div class="quiz-emoji">${sign.emoji}</div>
    <p class="quiz-prompt">${sign.desc}</p>
    <div class="choices" id="choices"></div>
  `;
  stage.appendChild(card);
  hideAction();

  choices.forEach(word => {
    const b = el('button','choice-btn');
    b.textContent = word;
    b.onclick = () => checkAnswer(word, sign.word, b);
    card.querySelector('#choices').appendChild(b);
  });
}

function makeChoices(correct) {
  const pool = shuffle(SIGNS.map(s=>s.word).filter(w=>w!==correct));
  // pad with words from other categories if not enough in current
  if (pool.length < 3) {
    const extra = ['Hello','Mother','Happy','Yes','A','B','C','No','Food','Love']
      .filter(w => w !== correct && !pool.includes(w));
    pool.push(...extra);
  }
  return shuffle([...pool.slice(0,3), correct]);
}

// ─────────────────────────────────────────────
// ANSWER
// ─────────────────────────────────────────────
function checkAnswer(chosen, correctWord, btn) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  if (chosen === correctWord) {
    btn.classList.add('correct');
    correct++;
    popXP();
    showFeedback(true, '✅ Correct!', `"${correctWord}" — great job!`);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.textContent.trim() === correctWord) b.classList.add('reveal');
    });
    lives--;
    wrong++;
    updateLives();
    popHeart();
    showFeedback(false, '❌ Not quite!', `The correct answer is "${correctWord}"`);
    if (lives <= 0) { setTimeout(() => showFinish(true), 1500); return; }
  }
}

function nextStep() {
  if (phase === 'quiz') { step++; phase = 'show'; }
  renderStep();
}

// ─────────────────────────────────────────────
// FEEDBACK
// ─────────────────────────────────────────────
function showFeedback(ok, title, sub) {
  const bar = document.getElementById('feedbackBar');
  bar.className = 'feedback-bar show ' + (ok ? 'ok' : 'bad');
  document.getElementById('fbIcon').textContent  = ok ? '🎉' : '💔';
  document.getElementById('fbTitle').textContent = title;
  document.getElementById('fbSub').textContent   = sub;
  hideAction();
}
function hideFeedback() {
  document.getElementById('feedbackBar').className = 'feedback-bar';
}

// ─────────────────────────────────────────────
// ACTION BUTTON
// ─────────────────────────────────────────────
function showAction(label, cb) {
  if (!actionWrap) {
    actionWrap = el('div','action-wrap');
    document.body.appendChild(actionWrap);
  }
  actionWrap.innerHTML = `<button>${label}</button>`;
  actionWrap.querySelector('button').onclick = cb;
  actionWrap.style.display = 'flex';
}
function hideAction() {
  if (actionWrap) actionWrap.style.display = 'none';
}

// ─────────────────────────────────────────────
// PROGRESS + LIVES
// ─────────────────────────────────────────────
function updateProgress() {
  const total   = SIGNS.length * 2;
  const current = step * 2 + (phase==='quiz' ? 1 : 0);
  document.getElementById('progressFill').style.width = (current/total*100) + '%';
}
function updateLives() {
  document.getElementById('livesEl').textContent =
    '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(5-lives,0));
}

// ─────────────────────────────────────────────
// ANIMATIONS
// ─────────────────────────────────────────────
function popXP() {
  const p = document.getElementById('xpPop');
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'), 1300);
}
function popHeart() {
  const h = el('div','heart-pop'); h.textContent='💔';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 600);
}

// ─────────────────────────────────────────────
// SAVE PROGRESS
// ─────────────────────────────────────────────
function saveCompletion() {
  if (isReplay) return; // don't re-save on replay
  try {
    const done = JSON.parse(localStorage.getItem('sp_completed') || '[]');
    if (!done.includes(catId)) {
      done.push(catId);
      localStorage.setItem('sp_completed', JSON.stringify(done));
    }
  } catch(e) {}
}

// ─────────────────────────────────────────────
// FINISH SCREEN
// ─────────────────────────────────────────────
function showFinish(failed=false) {
  hideAction(); hideFeedback();
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('stage').innerHTML = '';

  if (!failed) saveCompletion();

  const xp  = correct * 10;
  const fin = el('div','finish');

  if (failed) {
    fin.innerHTML = `
      <div class="finish-emoji">😢</div>
      <div class="finish-title">Out of hearts!</div>
      <p class="finish-sub">Don't give up — you're learning!</p>
      <button class="retry-btn" onclick="location.reload()">↺ Try Again</button>
      <a href="learn.html" class="back-btn">Back to Path</a>
    `;
  } else {
    const unlockBanner = lesson.next ? `
      <div class="unlock-banner">
        🔓 <strong>${lesson.nextLabel}</strong> is now unlocked!
      </div>` : `<div class="unlock-banner">🏆 You've completed all categories!</div>`;

    fin.innerHTML = `
      <div class="finish-emoji">🎉</div>
      <div class="finish-title">Lesson Complete!</div>
      <p class="finish-sub">You've learned all ${lesson.label} signs!</p>
      <div class="xp-badge">+${xp} XP earned 🌟</div>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${correct}</div><div class="stat-lbl">correct</div></div>
        <div class="stat-box"><div class="stat-num">${wrong}</div><div class="stat-lbl">mistakes</div></div>
        <div class="stat-box"><div class="stat-num">${SIGNS.length}</div><div class="stat-lbl">signs</div></div>
      </div>
      ${unlockBanner}
      <a href="learn.html" class="back-btn">Back to Path</a>
    `;
  }

  document.getElementById('stage').appendChild(fin);
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function el(tag,cls){ const e=document.createElement(tag); e.className=cls; return e; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function confirmExit(){
  if(confirm('Leave lesson? Progress will be lost.')) location.href='learn.html';
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
updateLives();
renderStep();
</script>
</body>
</html>
