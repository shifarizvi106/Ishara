<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara</title>

  <style>
    @font-face {
      font-family: 'Croissant One';
      src: url('assets/CroissantOne-Regular_1.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <link rel="stylesheet" href="style.css">
  <script src="assets/animation.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ====== SPLASH SCREEN ====== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FF74B4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-text {
      font-family: 'Croissant One', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      color: #F8F6F0;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(30px);
    }

    /* Main content starts hidden */
    #main-content {
      visibility: hidden;
      opacity: 0;
    }

    /* Additional Auth Styles while preserving main structure */
    .auth-fields {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }

    .auth-toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 14px 0;
      font-size: 0.8rem;
    }

    .auth-toggle-btn, .forgot-link {
      color: #d63384;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
    }

    .guest-option-btn {
      background: none;
      border: none;
      color: #a14a76;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
    }

    .error-box, .success-box {
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: none;
    }

    .error-box { background: #ffe4e6; color: #dc3545; }
    .success-box { background: #e6f4ea; color: #137333; }
  </style>
</head>
<body>

  <!-- ====== SPLASH SCREEN ====== -->
  <div id="splash-screen">
    <h1 class="splash-text">Ishara</h1>
  </div>

  <!-- ====== MAIN LANDING ====== -->
  <section class="landing" id="main-content">
    <div class="landing-card">
      <div class="butterfly">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body"></div>
      </div>

      <h1 class="logo">Ishara</h1>
      <p class="subtitle">Learn Indian Sign Language.</p>
      
      <div class="error-box" id="error-box"></div>
      <div class="success-box" id="success-box"></div>

      <form class="terms-form" id="consent-form">
        
        <!-- Auth Fields (Hidden initially until user toggles sign-in/up) -->
        <div class="auth-fields" id="auth-fields">
          <input type="text" id="auth-username" class="input-field" placeholder="Username" style="display:none;" />
          <input type="email" id="auth-email" class="input-field" placeholder="Email address" />
          <input type="password" id="auth-password" class="input-field" placeholder="Password" />
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="age-check" class="custom-checkbox">
            <span>I am at least 13 years old</span>
          </label>

          <br>
          
          <label class="checkbox-label">
            <input type="checkbox" id="tos-check" class="custom-checkbox">
            <span>I have read the <a href="tos.html" target="_blank" class="inline-link">Terms of Service</a></span>
          </label>
        </div>

        <div class="auth-toggle-row">
          <button type="button" class="auth-toggle-btn" id="auth-toggle-btn" onclick="toggleAuthFields()">Have an account? Sign In / Sign Up</button>
          <span class="forgot-link" id="forgot-link" style="display:none;" onclick="handleForgotPassword()">Forgot password?</span>
        </div>

        <button type="submit" id="start-btn" class="start-btn" disabled>Start Learning</button>
      </form>

      <button type="button" class="guest-option-btn" id="guest-btn" style="display:none;" onclick="continueAsGuest()">Continue without signing in</button>
    </div>

  </section>

  <!-- ====== LOGIC & ANIMATION ====== -->
  <script>
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isAuthActive = false;
    let authMode = 'signin'; // 'signin' or 'signup'

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. GSAP Splash Screen Animation
      const tl = gsap.timeline();

      tl.to(".splash-text", {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "power2.out",
        delay: 0.3
      })
      .to("#splash-screen", {
        opacity: 0,
        duration: 0.8,
        ease: "power2.inOut",
        delay: 1.2,
        onComplete: () => {
          document.getElementById("splash-screen").style.display = "none";
        }
      })
      .set("#main-content", { visibility: "visible" })
      .to("#main-content", {
        opacity: 1,
        duration: 0.8,
        ease: "power2.out"
      }, "-=0.4");

      // Check existing Supabase Session
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        localStorage.setItem('ishara_user_type', 'authenticated');
        window.location.href = 'learn.html';
        return;
      }

      // 2. Checkbox Validation Logic
      const ageCheck = document.getElementById('age-check');
      const tosCheck = document.getElementById('tos-check');
      const startBtn = document.getElementById('start-btn');
      const form = document.getElementById('consent-form');

      function validateForm() {
        startBtn.disabled = !(ageCheck.checked && tosCheck.checked);
      }

      ageCheck.addEventListener('change', validateForm);
      tosCheck.addEventListener('change', validateForm);

      // Form Submit Handler
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();

        if (startBtn.disabled) return;

        // Default Direct Guest Mode if Auth Fields aren't shown
        if (!isAuthActive) {
          continueAsGuest();
          return;
        }

        // Supabase Auth Handling
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const username = document.getElementById('auth-username').value.trim();

        if (!email || !password) {
          showError('Please fill in all required auth fields.');
          return;
        }

        startBtn.disabled = true;
        startBtn.innerText = 'Processing...';

        try {
          if (authMode === 'signin') {
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;

            localStorage.setItem('ishara_user_type', 'authenticated');
            localStorage.removeItem('ishara_guest');
            window.location.href = 'learn.html';
          } else {
            // Sign Up Flow
            if (!username) {
              showError('Please enter a username.');
              startBtn.disabled = false;
              startBtn.innerText = 'Sign Up';
              return;
            }

            const { data, error } = await _supabase.auth.signUp({
              email,
              password,
              options: { data: { display_name: username } }
            });
            if (error) throw error;

            // Sync to profiles table
            if (data?.user) {
              await _supabase.from('profiles').upsert({
                id: data.user.id,
                username: username,
                email: email,
                updated_at: new Date()
              });
            }

            // Email confirmation required check
            if (data?.user && !data?.session) {
              startBtn.disabled = false;
              startBtn.innerText = 'Sign Up';
              showSuccess('Account created! Please check your email to confirm before signing in.');
              return;
            }

            localStorage.setItem('ishara_username', username);
            localStorage.setItem('ishara_user_type', 'authenticated');
            localStorage.removeItem('ishara_guest');
            window.location.href = 'learn.html';
          }
        } catch (err) {
          showError(err.message || 'Authentication error');
          startBtn.disabled = false;
          validateForm();
          startBtn.innerText = authMode === 'signin' ? 'Sign In' : 'Sign Up';
        }
      });
    });

    function toggleAuthFields() {
      const authFields = document.getElementById('auth-fields');
      const toggleBtn = document.getElementById('auth-toggle-btn');
      const guestBtn = document.getElementById('guest-btn');
      const forgotLink = document.getElementById('forgot-link');
      const startBtn = document.getElementById('start-btn');
      const usernameInput = document.getElementById('auth-username');

      isAuthActive = !isAuthActive;

      if (isAuthActive) {
        authFields.style.display = 'flex';
        guestBtn.style.display = 'block';
        forgotLink.style.display = 'inline';
        toggleBtn.innerText = 'Switch to Sign Up';
        startBtn.innerText = 'Sign In';
      } else {
        authFields.style.display = 'none';
        guestBtn.style.display = 'none';
        forgotLink.style.display = 'none';
        toggleBtn.innerText = 'Have an account? Sign In / Sign Up';
        startBtn.innerText = 'Start Learning';
      }
    }

    function continueAsGuest() {
      localStorage.setItem('ishara_guest', 'true');
      localStorage.setItem('ishara_user_type', 'guest');
      localStorage.setItem('ishara_username', 'Guest Learner');
      if (!localStorage.getItem('sp_completed')) {
        localStorage.setItem('sp_completed', JSON.stringify([]));
      }
      window.location.href = 'learn.html';
    }

    async function handleForgotPassword() {
      hideMessages();
      const email = document.getElementById('auth-email').value.trim();
      if (!email) {
        showError('Please enter your email above to reset password.');
        return;
      }
      const { error } = await _supabase.auth.resetPasswordForEmail(email);
      if (error) showError(error.message);
      else showSuccess('Password reset link sent to your email.');
    }

    function showError(msg) {
      const eb = document.getElementById('error-box');
      eb.innerText = msg;
      eb.style.display = 'block';
    }

    function showSuccess(msg) {
      const sb = document.getElementById('success-box');
      sb.innerText = msg;
      sb.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
    }
  </script>

</body>
</html>
