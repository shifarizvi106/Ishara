<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara</title>

  <style>
    @font-face {
      font-family: 'Croissant One';
      src: url('assets/CroissantOne-Regular_1.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <link rel="stylesheet" href="style.css">
  <script src="assets/animation.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ====== SPLASH SCREEN ====== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FF74B4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-text {
      font-family: 'Croissant One', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      color: #F8F6F0;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(30px);
    }

    /* Main content starts hidden */
    #main-content {
      visibility: hidden;
      opacity: 0;
    }

    /* ====== AUTH VIEW ====== */
    .auth-card {
      display: none;
    }

    .auth-card.active {
      display: block;
    }

    .tab-switcher {
      display: flex;
      background: #fff0f6;
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #a14a76;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #d63384;
      box-shadow: 0 2px 8px rgba(255, 95, 162, 0.15);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #fbcfe8;
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }

    .input-field:focus {
      border-color: #ff5fa2;
    }

    #username-container {
      display: none;
    }

    /* ====== TOS HIGHLIGHT & STYLE ====== */
    .inline-link {
      color: #d63384;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .inline-link:hover {
      color: #ff5fa2;
    }

    .pwd-strength-meter {
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: -6px;
      display: none;
    }

    .pwd-weak { color: #dc3545; }
    .pwd-good { color: #137333; }

    .forgot-link {
      font-size: 0.78rem;
      color: #d63384;
      text-align: right;
      cursor: pointer;
      font-weight: 700;
      margin-top: -4px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #a14a76;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #fbcfe8;
    }

    .divider span {
      padding: 0 10px;
    }

    .guest-btn {
      background: none;
      border: none;
      color: #a14a76;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .error-box, .success-box {
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
    }

    .error-box { background: #ffe4e6; color: #dc3545; }
    .success-box { background: #e6f4ea; color: #137333; }

    .btn-loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ====== SINGLE SPLASH SCREEN ====== -->
  <div id="splash-screen">
    <h1 class="splash-text">Ishara</h1>
  </div>

  <!-- ====== MAIN CONTENT ====== -->
  <section class="landing" id="main-content">
    
    <!-- 1. LANDING PAGE VIEW -->
    <div class="landing-card" id="landing-view">
      <div class="butterfly">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body"></div>
      </div>

      <h1 class="logo">Ishara</h1>
      <p class="subtitle">Learn Indian Sign Language.</p>

      <form class="terms-form" id="consent-form">
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="age-check" class="custom-checkbox">
            <span>I am at least 13 years old</span>
          </label>

          <br>
          
          <label class="checkbox-label">
            <input type="checkbox" id="tos-check" class="custom-checkbox">
            <span>I have read the <a href="tos.html" target="_blank" class="inline-link">Terms of Service</a></span>
          </label>
        </div>

        <button type="submit" id="get-started-btn" class="start-btn" disabled>Start Learning</button>
      </form>
    </div>

    <!-- 2. LOGIN / SIGN UP CARD -->
    <div class="landing-card auth-card" id="auth-view">
      <div class="butterfly">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body"></div>
      </div>

      <h1 class="logo" style="font-size: 2rem; margin-bottom: 16px;">Ishara</h1>

      <div class="tab-switcher">
        <button class="tab-btn active" id="tab-signin" type="button" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" id="tab-signup" type="button" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div class="error-box" id="error-box"></div>
      <div class="success-box" id="success-box"></div>

      <form class="auth-form" id="auth-form">
        <!-- Username input appears here only under Sign Up tab -->
        <div id="username-container">
          <input type="text" id="auth-username" class="input-field" placeholder="Username / Display Name" />
        </div>

        <input type="email" id="auth-email" class="input-field" placeholder="Email address" required />
        <input type="password" id="auth-password" class="input-field" placeholder="Password" required oninput="evaluatePasswordStrength()" />
        
        <div class="pwd-strength-meter" id="pwd-meter"></div>

        <span class="forgot-link" id="forgot-link" onclick="handleForgotPassword()">Forgot password?</span>

        <button type="submit" id="submit-auth-btn" class="start-btn">Sign In</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" class="guest-btn" id="guest-btn" onclick="continueAsGuest()">Continue without signing in</button>
    </div>

  </section>

  <!-- ====== LOGIC & ANIMATION ====== -->
  <script>
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authMode = 'signin';

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Single GSAP Splash Screen Animation
      const tl = gsap.timeline();

      tl.to(".splash-text", {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "power2.out",
        delay: 0.3
      })
      .to("#splash-screen", {
        opacity: 0,
        duration: 0.8,
        ease: "power2.inOut",
        delay: 1.2,
        onComplete: () => {
          document.getElementById("splash-screen").style.display = "none";
        }
      })
      .set("#main-content", { visibility: "visible" })
      .to("#main-content", {
        opacity: 1,
        duration: 0.8,
        ease: "power2.out"
      }, "-=0.4");

      // Session Check
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        localStorage.setItem('ishara_user_type', 'authenticated');
        localStorage.setItem('ishara_skip_splash', 'true');
        window.location.href = 'learn.html';
        return;
      }

      // Checkbox Validation
      const ageCheck = document.getElementById('age-check');
      const tosCheck = document.getElementById('tos-check');
      const getStartedBtn = document.getElementById('get-started-btn');
      const consentForm = document.getElementById('consent-form');

      function validateConsent() {
        getStartedBtn.disabled = !(ageCheck.checked && tosCheck.checked);
      }

      ageCheck.addEventListener('change', validateConsent);
      tosCheck.addEventListener('change', validateConsent);

      consentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!getStartedBtn.disabled) {
          document.getElementById('landing-view').style.display = 'none';
          document.getElementById('auth-view').classList.add('active');
        }
      });

      // Login/Signup Form Handling
      const authForm = document.getElementById('auth-form');
      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();

        const submitBtn = document.getElementById('submit-auth-btn');
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const username = document.getElementById('auth-username').value.trim();

        if (authMode === 'signup') {
          if (!username) {
            showError('Please choose a username.');
            return;
          }
          if (!validatePasswordStrength(password)) {
            showError('Password must be at least 8 characters long and contain both letters and numbers.');
            return;
          }
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="btn-loader"></span>';

        try {
          if (authMode === 'signin') {
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;

            localStorage.setItem('ishara_user_type', 'authenticated');
            localStorage.setItem('ishara_skip_splash', 'true');
            localStorage.removeItem('ishara_guest');
            window.location.href = 'learn.html';
          } else {
            const { data, error } = await _supabase.auth.signUp({
              email,
              password,
              options: {
                data: { display_name: username }
              }
            });
            if (error) throw error;

            if (data?.user) {
              await _supabase
                .from('profiles')
                .upsert({
                  id: data.user.id,
                  username: username,
                  email: email,
                  updated_at: new Date()
                });
            }

            if (data?.user && !data?.session) {
              submitBtn.disabled = false;
              submitBtn.innerText = 'Sign Up';
              showSuccess('Account created! Please check your email to confirm before logging in.');
              return;
            }

            localStorage.setItem('ishara_username', username);
            localStorage.setItem('ishara_user_type', 'authenticated');
            localStorage.setItem('ishara_skip_splash', 'true');
            localStorage.removeItem('ishara_guest');
            window.location.href = 'learn.html';
          }
        } catch (err) {
          showError(err.message || 'Authentication failed.');
          submitBtn.disabled = false;
          submitBtn.innerText = authMode === 'signin' ? 'Sign In' : 'Sign Up';
        }
      });
    });

    // Directly redirects as Guest and signals learn.html to skip duplicate splash cards
    function continueAsGuest() {
      localStorage.setItem('ishara_guest', 'true');
      localStorage.setItem('ishara_user_type', 'guest');
      localStorage.setItem('ishara_username', 'Guest Learner');
      localStorage.setItem('ishara_skip_splash', 'true');
      
      if (!localStorage.getItem('ishara_guest_progress')) {
        localStorage.setItem('ishara_guest_progress', JSON.stringify([]));
      }
      if (!localStorage.getItem('sp_completed')) {
        localStorage.setItem('sp_completed', JSON.stringify([]));
      }

      window.location.href = 'learn.html';
    }

    function evaluatePasswordStrength() {
      if (authMode !== 'signup') return;
      
      const pwd = document.getElementById('auth-password').value;
      const pwdMeter = document.getElementById('pwd-meter');

      if (!pwd) {
        pwdMeter.style.display = 'none';
        return;
      }

      pwdMeter.style.display = 'block';
      if (validatePasswordStrength(pwd)) {
        pwdMeter.className = 'pwd-strength-meter pwd-good';
        pwdMeter.innerText = 'Strong password';
      } else {
        pwdMeter.className = 'pwd-strength-meter pwd-weak';
        pwdMeter.innerText = 'Must be 8+ chars with letters & numbers';
      }
    }

    function validatePasswordStrength(pwd) {
      return pwd.length >= 8 && /[a-zA-Z]/.test(pwd) && /[0-9]/.test(pwd);
    }

    function switchTab(targetMode) {
      authMode = targetMode;
      const signinTab = document.getElementById('tab-signin');
      const signupTab = document.getElementById('tab-signup');
      const submitBtn = document.getElementById('submit-auth-btn');
      const forgotLink = document.getElementById('forgot-link');
      const pwdMeter = document.getElementById('pwd-meter');
      const usernameContainer = document.getElementById('username-container');
      const usernameInput = document.getElementById('auth-username');

      hideMessages();

      if (authMode === 'signin') {
        signinTab.classList.add('active');
        signupTab.classList.remove('active');
        submitBtn.innerText = 'Sign In';
        forgotLink.style.display = 'block';
        pwdMeter.style.display = 'none';
        usernameContainer.style.display = 'none';
        usernameInput.removeAttribute('required');
      } else {
        signupTab.classList.add('active');
        signinTab.classList.remove('active');
        submitBtn.innerText = 'Sign Up';
        forgotLink.style.display = 'none';
        usernameContainer.style.display = 'block';
        usernameInput.setAttribute('required', 'true');
        evaluatePasswordStrength();
      }
    }

    async function handleForgotPassword() {
      hideMessages();
      const email = document.getElementById('auth-email').value.trim();

      if (!email) {
        showError('Please enter your email address to reset password.');
        return;
      }

      const { error } = await _supabase.auth.resetPasswordForEmail(email);
      if (error) {
        showError(error.message);
      } else {
        showSuccess('Password reset link sent to your email.');
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('error-box');
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    function showSuccess(msg) {
      const successBox = document.getElementById('success-box');
      successBox.innerText = msg;
      successBox.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
    }
  </script>

</body>
</html>
