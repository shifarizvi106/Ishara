<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara</title>

  
  <style>
    @font-face {
      font-family: 'Croissant One';
      src: url('assets/CroissantOne-Regular_1.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <link rel="stylesheet" href="style.css">
  <script src="assets/animation.js"></script>

  <style>
    /* ====== SPLASH SCREEN ====== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FF74B4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-text {
      font-family: 'Croissant One', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      color: #F8F6F0;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(30px);
    }

    /* Main content starts hidden */
    #main-content {
      visibility: hidden;
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- ====== SPLASH SCREEN  ====== -->
  <div id="splash-screen">
    <h1 class="splash-text">Ishara</h1>
  </div>

  <!-- ====== MAIN LANDING ====== -->
  <section class="landing" id="main-content">
    <div class="butterfly">
      <div class="wing left"></div>
      <div class="wing right"></div>
      <div class="body"></div>
    </div>

    <h1 class="logo">Ishara</h1>
    <p class="subtitle">Learn Indian Sign Language.</p>
    <form class="terms-form" id="consent-form">
  <div class="checkbox-group">
    <label class="checkbox-label">
      <input type="checkbox" id="age-check" class="custom-checkbox">
      <span>I am at least 13 years old</span>
    </label>
    
    <label class="checkbox-label">
      <input type="checkbox" id="tos-check" class="custom-checkbox">
      <span>I have read the <a href="#" class="inline-link">Terms of Service</a></span>
    </label>
  </div>

  <button type="submit" id="start-btn" class="start-btn" disabled>Start Learning</button>
      <a href="tos.html" target="_blank" class="inline-link">Terms of Service</a>
</form>
  </section>

  <!-- ====== ANIMATION ====== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tl = gsap.timeline();

      // Text fades/slides in
      tl.to(".splash-text", {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "power2.out",
        delay: 0.3
      })
      // Hold briefly, then fade splash out
      .to("#splash-screen", {
        opacity: 0,
        duration: 0.8,
        ease: "power2.inOut",
        delay: 1.2,
        onComplete: () => {
          document.getElementById("splash-screen").style.display = "none";
        }
      })
      .set("#main-content", { visibility: "visible" })
      .to("#main-content", {
        opacity: 1,
        duration: 0.8,
        ease: "power2.out"
      }, "-=0.4");
    });
  </script>

</body>
</html>
