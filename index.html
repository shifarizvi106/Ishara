<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara</title>

  <style>
    @font-face {
      font-family: 'Croissant One';
      src: url('assets/CroissantOne-Regular_1.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <link rel="stylesheet" href="style.css">
  <script src="assets/animation.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ====== SPLASH SCREEN ====== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FF74B4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-text {
      font-family: 'Croissant One', cursive;
      font-size: clamp(3rem, 10vw, 6rem);
      color: #F8F6F0;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(30px);
    }

    /* Main content starts hidden */
    #main-content {
      visibility: hidden;
      opacity: 0;
    }

    /* Message Boxes */
    .msg-box {
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
    }

    .msg-error { background: #ffe4e6; color: #dc3545; }
    .msg-success { background: #e6f4ea; color: #137333; }

    .username-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- ====== SPLASH SCREEN ====== -->
  <div id="splash-screen">
    <h1 class="splash-text">Ishara</h1>
  </div>

  <!-- ====== MAIN LANDING ====== -->
  <section class="landing" id="main-content">
    <div class="landing-card">
      <div class="butterfly">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body"></div>
      </div>

      <h1 class="logo">Ishara</h1>
      <p class="subtitle">Learn Indian Sign Language.</p>

      <div class="msg-box msg-error" id="error-box"></div>
      <div class="msg-box msg-success" id="success-box"></div>
      
      <form class="terms-form" id="consent-form">
        <!-- Optional Username field for profile registration -->
        <input type="text" id="username-input" class="username-input" placeholder="Choose a Username (Optional)" />

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="age-check" class="custom-checkbox">
            <span>I am at least 13 years old</span>
          </label>

          <br>
          
          <label class="checkbox-label">
            <input type="checkbox" id="tos-check" class="custom-checkbox">
            <span>I have read the <a href="tos.html" target="_blank" class="inline-link">Terms of Service</a></span>
          </label>
        </div>

        <button type="submit" id="start-btn" class="start-btn" disabled>Start Learning</button>
      </form>
    </div>

  </section>

  <!-- ====== LOGIC & ANIMATION ====== -->
  <script>
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. GSAP Splash Screen Animation
      const tl = gsap.timeline();

      tl.to(".splash-text", {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "power2.out",
        delay: 0.3
      })
      .to("#splash-screen", {
        opacity: 0,
        duration: 0.8,
        ease: "power2.inOut",
        delay: 1.2,
        onComplete: () => {
          document.getElementById("splash-screen").style.display = "none";
        }
      })
      .set("#main-content", { visibility: "visible" })
      .to("#main-content", {
        opacity: 1,
        duration: 0.8,
        ease: "power2.out"
      }, "-=0.4");

      // Check existing user session
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        localStorage.setItem('ishara_user_type', 'authenticated');
        window.location.href = 'learn.html';
        return;
      }

      // 2. Checkbox Validation Logic
      const ageCheck = document.getElementById('age-check');
      const tosCheck = document.getElementById('tos-check');
      const startBtn = document.getElementById('start-btn');
      const form = document.getElementById('consent-form');

      function validateForm() {
        startBtn.disabled = !(ageCheck.checked && tosCheck.checked);
      }

      ageCheck.addEventListener('change', validateForm);
      tosCheck.addEventListener('change', validateForm);

      // Form Submission Logic
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();

        if (startBtn.disabled) return;

        const usernameVal = document.getElementById('username-input').value.trim() || 'Learner';

        // Set Guest mode details so learn.html functions seamlessly
        localStorage.setItem('ishara_guest', 'true');
        localStorage.setItem('ishara_user_type', 'guest');
        localStorage.setItem('ishara_username', usernameVal);

        if (!localStorage.getItem('sp_completed')) {
          localStorage.setItem('sp_completed', JSON.stringify([]));
        }

        // Sync username to database if session exists, else proceed directly
        try {
          const { data: { user } } = await _supabase.auth.getUser();
          if (user) {
            await _supabase.from('profiles').upsert({
              id: user.id,
              username: usernameVal,
              updated_at: new Date()
            });
          }
        } catch (err) {
          console.warn('Proceeding in offline/guest mode:', err);
        }

        window.location.href = 'learn.html';
      });
    });

    function showError(msg) {
      const eb = document.getElementById('error-box');
      eb.innerText = msg;
      eb.style.display = 'block';
    }

    function showSuccess(msg) {
      const sb = document.getElementById('success-box');
      sb.innerText = msg;
      sb.style.display = 'block';
    }

    function hideMessages() {
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('success-box').style.display = 'none';
    }
  </script>

</body>
</html>
