<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignPath – Practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="sign_model.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #ffe3f1, #fde6f2);
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column;
      color: #3a2a33;
    }

    .practice-header {
      display: flex; align-items: center;
      padding: 18px 22px 12px;
      gap: 12px;
    }
    .back-btn {
      background: white; border: 2px solid #f4b6d2;
      border-radius: 999px; padding: 8px 16px;
      font-size: 0.82rem; font-weight: 700;
      color: #a14a76; cursor: pointer;
      text-decoration: none;
    }
    .practice-title {
      flex: 1; text-align: center;
      font-size: 1rem; font-weight: 900; color: #d63384;
    }
    .sign-counter {
      font-size: 0.78rem; font-weight: 700; color: #c77aa0;
    }

    .practice-body {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      padding: 8px 16px 24px;
    }

    .reference-card {
      background: white; border-radius: 24px;
      padding: 16px; width: 100%; max-width: 340px;
      box-shadow: 0 8px 28px rgba(255,95,162,0.15);
      display: flex; align-items: center; gap: 14px;
      border: 2px solid #fde6f2;
      transition: border-color 0.3s;
    }
    .reference-card.success { border-color: #ff5fa2; box-shadow: 0 8px 28px rgba(255,95,162,0.35); }

    .sign-preview {
      width: 80px; height: 80px; flex-shrink: 0;
      background: #fff0f6; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; overflow: hidden;
    }
    .sign-preview img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .sign-info { flex: 1; }
    .sign-word { font-size: 1.3rem; font-weight: 900; color: #d63384; display: block; margin-bottom: 4px; }
    .sign-desc { font-size: 0.72rem; color: #a14a76; line-height: 1.5; }
    .sign-tip  { font-size: 0.68rem; color: #c77aa0; font-style: italic; margin-top: 4px; display: block; }

    .camera-wrap {
      position: relative;
      width: 100%; max-width: 960px;
      aspect-ratio: 4/3;
      border-radius: 24px; overflow: hidden;
      background: #2a1a22;
      box-shadow: 0 8px 32px rgba(255,95,162,0.2);
      border: 3px solid #f4b6d2;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .camera-wrap.detecting { border-color: #ff5fa2; }
    .camera-wrap.success {
      border-color: #ff5fa2;
      box-shadow: 0 0 0 4px rgba(255,95,162,0.4), 0 8px 32px rgba(255,95,162,0.3);
    }

    video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    canvas#overlay {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
    }

    .status-pill {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(42,26,34,0.75);
      color: white; border-radius: 999px;
      padding: 6px 16px; font-size: 0.75rem; font-weight: 700;
      backdrop-filter: blur(4px);
      transition: all 0.3s;
      white-space: nowrap;
    }
    .status-pill.ok      { background: rgba(255,95,162,0.85); }
    .status-pill.success { background: rgba(214,51,132,0.9); }

    /* Confidence bar */
    .confidence-bar-wrap {
      width: 100%; max-width: 340px;
      background: white; border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 4px 16px rgba(255,95,162,0.1);
      border: 2px solid #fde6f2;
    }
    .confidence-label {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; font-weight: 700; color: #a14a76;
      margin-bottom: 6px;
    }
    .confidence-track {
      height: 8px; background: #f4b6d2;
      border-radius: 999px; overflow: hidden;
    }
    .confidence-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ff5fa2, #d63384);
      border-radius: 999px;
      transition: width 0.2s;
    }
    .detected-label {
      margin-top: 6px; font-size: 0.78rem;
      font-weight: 800; color: #d63384; text-align: center;
    }

    .cam-prompt {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; background: #2a1a22; z-index: 10;
    }
    .cam-prompt p { color: #f4b6d2; font-size: 0.85rem; text-align: center; padding: 0 20px; }
    .cam-start-btn {
      background: linear-gradient(135deg, #ff5fa2, #d63384);
      color: white; border: none; border-radius: 999px;
      padding: 10px 24px; font-size: 0.88rem; font-weight: 800;
      cursor: pointer;
    }

    .nav-row {
      display: flex; gap: 10px;
      width: 100%; max-width: 340px;
    }
    .nav-btn {
      flex: 1; background: white;
      border: 2px solid #f4b6d2; border-radius: 999px;
      padding: 12px; font-size: 0.85rem; font-weight: 800;
      color: #a14a76; cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover { border-color: #ff5fa2; color: #d63384; }
    .nav-btn.primary {
      background: linear-gradient(135deg, #ff5fa2, #d63384);
      color: white; border-color: transparent;
      box-shadow: 0 6px 20px rgba(255,95,162,0.3);
    }

    /* Success flash overlay */
    .success-flash {
      position: fixed; inset: 0;
      background: rgba(255,95,162,0.15);
      pointer-events: none; z-index: 50;
      opacity: 0; transition: opacity 0.15s;
    }
    .success-flash.show { opacity: 1; }
  </style>
</head>
<body>

<div class="success-flash" id="successFlash"></div>

<div class="practice-header">
  <a href="learn.html" class="back-btn">← Home</a>
  <div class="practice-title">Practice Mode</div>
  <div class="sign-counter" id="signCounter">1 / 8</div>
</div>

<div class="practice-body">

  <div class="reference-card" id="referenceCard">
    <div class="sign-preview" id="signPreview">👋</div>
    <div class="sign-info">
      <span class="sign-word" id="signWord">Hello</span>
      <div class="sign-desc" id="signDesc"></div>
      <span class="sign-tip" id="signTip"></span>
    </div>
  </div>

  <div class="camera-wrap" id="cameraWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div class="status-pill" id="statusPill">👋 Show your hand</div>
    <div class="cam-prompt" id="camPrompt">
      <p>Camera needed to detect your signs</p>
      <button class="cam-start-btn" onclick="startCamera()">Enable Camera</button>
    </div>
  </div>

  <!-- Live detection readout -->
  <div class="confidence-bar-wrap" id="confWrap" style="display:none">
    <div class="confidence-label">
      <span>Detection confidence</span>
      <span id="confPct">0%</span>
    </div>
    <div class="confidence-track">
      <div class="confidence-fill" id="confFill"></div>
    </div>
    <div class="detected-label" id="detectedLabel">—</div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" onclick="prevSign()">← Prev</button>
    <button class="nav-btn primary" onclick="nextSign()">Next →</button>
  </div>

</div>

<script>
const SIGNS = [
  { word:'A', emoji:'🅰️', img:'assets/a.png',        desc:'Make a fist with thumb resting on the side.',                tip:'Compact and clean — like the letter A' },
  { word:'B', emoji:'🅱️', img:'assets/b.png',        desc:'Hold four fingers up together, thumb tucked across palm.',   tip:'Flat fingers — like the straight lines of B' },
  { word:'C', emoji:'©️',  img:'assets/c.png',        desc:'Curve your hand into a C shape.',                           tip:'Your hand literally makes a C!' },
  { word:'D', emoji:'🔵', img:'assets/d.png',        desc:'Index finger points up, other fingers form a circle.',       tip:'The circle is the round belly of D' },
  { word:'0', emoji:'0️⃣', img:null,                  desc:'Curve all fingers and thumb to touch, forming an O.',       tip:'Like the letter O — zero looks the same!' },
  { word:'1', emoji:'1️⃣', img:null,                  desc:'Hold up your index finger, all other fingers closed.',      tip:'Just one finger up!' },
  { word:'Y', emoji:'🤙', img:null,                  desc:'Thumb and pinky extended, other fingers closed.',            tip:'Shaka / hang loose!' },
  { word:'V', emoji:'✌️', img:null,                  desc:'Index and middle fingers up and spread in a V.',             tip:'Peace sign!' },
];

let current = 0;
let holdTimer = null;
let holdCount = 0;
const HOLD_FRAMES = 12; // frames to hold before auto-advance
const CONFIDENCE_THRESHOLD = 0.75;

function render() {
  const sign = SIGNS[current];
  document.getElementById('signCounter').textContent = `${current+1} / ${SIGNS.length}`;
  document.getElementById('signWord').textContent    = sign.word;
  document.getElementById('signDesc').textContent    = sign.desc;
  document.getElementById('signTip').textContent     = '💡 ' + sign.tip;
  document.getElementById('referenceCard').classList.remove('success');
  document.getElementById('cameraWrap').classList.remove('success');
  holdCount = 0;

  const preview = document.getElementById('signPreview');
  if (sign.img) {
    preview.innerHTML = `<img src="${sign.img}" alt="${sign.word}" onerror="this.parentElement.textContent='${sign.emoji}'">`;
  } else {
    preview.textContent = sign.emoji;
  }
}

function nextSign() {
  if (current < SIGNS.length - 1) { current++; render(); }
  else {
    document.getElementById('statusPill').textContent = '🎉 All done!';
    document.getElementById('statusPill').classList.add('success');
  }
}
function prevSign() {
  if (current > 0) { current--; render(); }
}

function flashSuccess() {
  const flash = document.getElementById('successFlash');
  document.getElementById('referenceCard').classList.add('success');
  document.getElementById('cameraWrap').classList.add('success');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 300);
  setTimeout(() => nextSign(), 900);
}

// ── Camera ──
function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' }, audio: false })
    .then(stream => {
      const video = document.getElementById('video');
      video.srcObject = stream;
      document.getElementById('camPrompt').style.display = 'none';
      document.getElementById('confWrap').style.display  = 'block';
      initMediaPipe();
    })
    .catch(() => {
      document.getElementById('camPrompt').querySelector('p').textContent =
        'Camera access denied. Please allow in browser settings.';
    });
}

// ── MediaPipe + Model ──
function initMediaPipe() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx    = canvas.getContext('2d');
  const pill   = document.getElementById('statusPill');
  const wrap   = document.getElementById('cameraWrap');

  const hands = new Hands({ locateFile: f =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.5 });

  hands.onResults(results => {
    canvas.width  = video.videoWidth  || canvas.offsetWidth;
    canvas.height = video.videoHeight || canvas.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiHandLandmarks?.length) {
      const landmarks = results.multiHandLandmarks[0];

      // Draw skeleton
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color:'#ff5fa2', lineWidth:2 });
      drawLandmarks(ctx, landmarks,  { color:'#d63384', lineWidth:1, radius:3 });

      wrap.classList.add('detecting');
      pill.classList.add('ok');

      // ── Run model ──
      const prediction = predictSign(landmarks);
      const conf = Math.round(prediction.confidence * 100);
      const label = prediction.label;

      document.getElementById('confFill').style.width  = conf + '%';
      document.getElementById('confPct').textContent   = conf + '%';
      document.getElementById('detectedLabel').textContent = `Detected: ${label} (${conf}%)`;

      const target = SIGNS[current].word;
      if (label === target && prediction.confidence >= CONFIDENCE_THRESHOLD) {
        pill.textContent = `✓ ${label} — hold it!`;
        pill.classList.add('success');
        holdCount++;
        if (holdCount >= HOLD_FRAMES) {
          holdCount = 0;
          flashSuccess();
        }
      } else {
        pill.textContent = `✋ Detecting...`;
        pill.classList.remove('success');
        holdCount = 0;
      }

    } else {
      pill.textContent = '👋 Show your hand';
      pill.classList.remove('ok');
      pill.classList.remove('success');
      wrap.classList.remove('detecting');
      wrap.classList.remove('success');
      document.getElementById('confFill').style.width = '0%';
      document.getElementById('confPct').textContent  = '0%';
      document.getElementById('detectedLabel').textContent = '—';
      holdCount = 0;
    }
  });

  const cam = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640, height: 480
  });
  cam.start();
}

render();
</script>
</body>
</html>
