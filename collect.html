<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara – Practice</title>

  <!-- Google Fonts: Plus Jakarta Sans & Croissant One -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- MediaPipe Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="sign_model.js"></script>

  <style>
    :root {
      --bg-body: #fff0f6;
      --bg-card: #ffffff;
      --primary: #ff5fa2;
      --primary-hover: #d63384;
      --primary-light: #ffe6f2;
      --border: #fbcfe8;
      --text-main: #1f2937;
      --text-muted: #833a5c;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(255, 95, 162, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 240px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-family: 'Croissant One', cursive;
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 32px;
      padding-left: 8px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item button {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      background: none;
      border: none;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-item.active button, .nav-item button:hover {
      background: var(--primary-light);
      color: var(--primary-hover);
    }

    /* Main Area */
    .main-content {
      flex: 1;
      padding: 32px 40px;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .practice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .sign-counter {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary-hover);
      background: var(--primary-light);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .practice-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .reference-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 540px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 20px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .reference-card.success {
      border-color: var(--primary);
      box-shadow: 0 4px 20px rgba(255, 95, 162, 0.3);
    }

    .sign-preview {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      background: var(--bg-body);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-hover);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .sign-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .sign-info { flex: 1; }
    
    .sign-word {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary-hover);
      display: block;
      margin-bottom: 4px;
    }

    .sign-desc {
      font-size: 0.85rem;
      color: #4b5563;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .sign-tip {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      display: block;
    }

    /* Camera Viewport */
    .camera-wrap {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 4/3;
      border-radius: 20px;
      overflow: hidden;
      background: #1f2937;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .camera-wrap.detecting { border-color: var(--primary); }
    .camera-wrap.success {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 95, 162, 0.3);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    canvas#overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .status-pill {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.85);
      color: white;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 0.8rem;
      font-weight: 700;
      backdrop-filter: blur(4px);
      transition: all 0.3s;
      white-space: nowrap;
    }

    .status-pill.ok { background: rgba(255, 95, 162, 0.9); }
    .status-pill.success { background: rgba(214, 51, 132, 1); }

    .cam-prompt {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1f2937;
      z-index: 10;
    }

    .cam-prompt p {
      color: var(--primary-light);
      font-size: 0.88rem;
      text-align: center;
      padding: 0 20px;
    }

    .cam-start-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .cam-start-btn:hover {
      background: var(--primary-hover);
    }

    .confidence-bar-wrap {
      width: 100%;
      max-width: 540px;
      background: var(--bg-card);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .confidence-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .confidence-track {
      height: 6px;
      background: var(--primary-light);
      border-radius: 999px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.15s;
    }

    .detected-label {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--primary-hover);
      text-align: center;
    }

    .nav-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 540px;
    }

    .nav-btn {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover { 
      background: var(--primary-light); 
      color: var(--primary-hover); 
    }

    .nav-btn.primary {
      background: var(--primary);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 95, 162, 0.25);
    }

    .nav-btn.primary:hover {
      background: var(--primary-hover);
    }

    .success-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 95, 162, 0.15);
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .success-flash.show { opacity: 1; }
  </style>
</head>
<body>

<div class="success-flash" id="successFlash"></div>

<!-- Sidebar Navigation -->
<aside class="sidebar">
  <div>
    <div class="brand">Ishara</div>
    <ul class="nav-list">
      <li class="nav-item" id="navDash"><button onclick="window.location.href='learn.html'">Dashboard</button></li>
      <li class="nav-item active" id="navPractice"><button onclick="window.location.href='practice.html'">Practice Mode</button></li>
    </ul>
  </div>
</aside>

<!-- Main Workarea -->
<main class="main-content">
  <div class="practice-header">
    <h1 class="page-title">Practice Mode</h1>
    <div class="sign-counter" id="signCounter">1 / 8</div>
  </div>

  <div class="practice-body">

    <div class="reference-card" id="referenceCard">
      <div class="sign-preview" id="signPreview"></div>
      <div class="sign-info">
        <span class="sign-word" id="signWord">A</span>
        <div class="sign-desc" id="signDesc"></div>
        <span class="sign-tip" id="signTip"></span>
      </div>
    </div>

    <div class="camera-wrap" id="cameraWrap">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
      <div class="status-pill" id="statusPill">Show your hand</div>
      <div class="cam-prompt" id="camPrompt">
        <p>Camera permission required for hand landmark detection</p>
        <button class="cam-start-btn" onclick="startCamera()">Enable Camera</button>
      </div>
    </div>

    <div class="confidence-bar-wrap" id="confWrap" style="display:none">
      <div class="confidence-label">
        <span>Detection Confidence</span>
        <span id="confPct">0%</span>
      </div>
      <div class="confidence-track">
        <div class="confidence-fill" id="confFill"></div>
      </div>
      <div class="detected-label" id="detectedLabel">No sign detected</div>
    </div>

    <div class="nav-row" id="navRow">
      <button class="nav-btn" onclick="prevSign()">Previous</button>
      <button class="nav-btn primary" onclick="nextSign()">Next Sign</button>
    </div>
  </div>
</main>

<script>
const SIGNS = [
  { word:'A', img:'assets/a.png', desc:'Make a fist with thumb resting on the side.', tip:'Keep your thumb flat against the side of your index finger.' },
  { word:'B', img:'assets/b.png', desc:'Hold four fingers up together, thumb tucked across palm.', tip:'Keep all four fingers straight and flush together.' },
  { word:'C', img:'assets/c.png', desc:'Curve your hand into a C shape.', tip:'Form an arc with your fingers and thumb.' },
  { word:'D', img:'assets/d.png', desc:'Index finger points up, other fingers form a circle.', tip:'Touch your thumb to your middle finger to form the loop.' },
  { word:'0', img:null, desc:'Curve all fingers and thumb to touch, forming an O.', tip:'Align your fingertips to create an open oval.' },
  { word:'1', img:null, desc:'Hold up your index finger, all other fingers closed.', tip:'Extend only your index finger upwards.' },
  { word:'Y', img:null, desc:'Thumb and pinky extended, other fingers closed.', tip:'Extend your thumb and pinky outward completely.' },
  { word:'V', img:null, desc:'Index and middle fingers up and spread in a V.', tip:'Separate index and middle finger while tucking others.' }
];

const SMOOTH_WINDOW  = 10;
const CONF_THRESHOLD = 0.68;
const HOLD_FRAMES    = 18;

let current      = 0;
let holdCount    = 0;
const recentPreds = [];

function render() {
  const s = SIGNS[current];
  document.getElementById('signCounter').textContent = `${current+1} / ${SIGNS.length}`;
  document.getElementById('signWord').textContent    = s.word;
  document.getElementById('signDesc').textContent    = s.desc;
  document.getElementById('signTip').textContent     = 'Tip: ' + s.tip;
  document.getElementById('referenceCard').classList.remove('success');
  document.getElementById('cameraWrap').classList.remove('success');
  holdCount = 0; 
  recentPreds.length = 0;
  
  const preview = document.getElementById('signPreview');
  if (s.img) {
    preview.innerHTML = `<img src="${s.img}" alt="${s.word}" onerror="this.parentElement.textContent='${s.word}'">`;
  } else { 
    preview.textContent = s.word; 
  }
}

function nextSign() {
  if (current < SIGNS.length - 1) { 
    current++; 
    render(); 
  } else {
    const pill = document.getElementById('statusPill');
    pill.textContent = 'Practice Complete'; 
    pill.classList.add('success');
  }
}

function prevSign() { 
  if (current > 0) { 
    current--; 
    render(); 
  } 
}

function flashSuccess() {
  const flash = document.getElementById('successFlash');
  document.getElementById('referenceCard').classList.add('success');
  document.getElementById('cameraWrap').classList.add('success');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 300);
  setTimeout(() => nextSign(), 900);
}

function smoothed() {
  if (!recentPreds.length) return null;
  const counts = {};
  let best = null, bestN = 0;
  for (const p of recentPreds) {
    counts[p] = (counts[p] || 0) + 1;
    if (counts[p] > bestN) { bestN = counts[p]; best = p; }
  }
  return { label: best, votes: bestN, total: recentPreds.length };
}

function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(stream => {
      document.getElementById('video').srcObject = stream;
      document.getElementById('camPrompt').style.display = 'none';
      document.getElementById('confWrap').style.display  = 'block';
      initMediaPipe();
    })
    .catch(() => {
      document.getElementById('camPrompt').querySelector('p').textContent =
        'Camera access denied. Please allow access in your browser settings.';
    });
}

function initMediaPipe() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx    = canvas.getContext('2d');
  const pill   = document.getElementById('statusPill');
  const wrap   = document.getElementById('cameraWrap');

  const hands = new Hands({ locateFile: f =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });

  hands.onResults(results => {
    canvas.width  = video.videoWidth  || canvas.offsetWidth;
    canvas.height = video.videoHeight || canvas.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiHandLandmarks?.length) {

      for (const lm of results.multiHandLandmarks) {
        drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#ff5fa2', lineWidth: 3 });
        for (const pt of lm) {
          const x = pt.x * canvas.width;
          const y = pt.y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 9, 0, 2 * Math.PI);
          ctx.fillStyle = 'rgba(255,95,162,0.22)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 4.5, 0, 2 * Math.PI);
          ctx.fillStyle = '#ff5fa2';
          ctx.shadowColor = '#ff5fa2';
          ctx.shadowBlur  = 12;
          ctx.fill();
          ctx.shadowBlur  = 0;
        }
      }

      wrap.classList.add('detecting');
      pill.classList.add('ok');

      const pred = predictSign(results.multiHandLandmarks[0]);
      const conf  = pred.confidence;
      const label = pred.label;

      if (conf >= CONF_THRESHOLD) {
        recentPreds.push(label);
        if (recentPreds.length > SMOOTH_WINDOW) recentPreds.shift();
      } else {
        recentPreds.length = 0;
      }

      const sm = smoothed();
      const DISPLAY_THRESHOLD = 0.72;
      const strongEnough = sm && sm.votes >= Math.ceil(SMOOTH_WINDOW * 0.7) && conf >= DISPLAY_THRESHOLD;
      const dispLabel = strongEnough ? sm.label : null;
      const dispConf  = strongEnough ? Math.round((sm.votes / sm.total) * 100) : 0;

      document.getElementById('confFill').style.width      = dispConf + '%';
      document.getElementById('confPct').textContent       = strongEnough ? dispConf + '%' : '0%';
      document.getElementById('detectedLabel').textContent = strongEnough
        ? `Detected: ${dispLabel} (${dispConf}% agreement)`
        : 'No sign detected';

      const target = SIGNS[current].word;
      const locked = strongEnough && dispLabel === target;
      
      if (locked) {
        pill.textContent = `Correct: ${target} — Hold position`;
        pill.classList.add('success');
        holdCount++;
        if (holdCount >= HOLD_FRAMES) { 
          holdCount = 0; 
          flashSuccess(); 
        }
      } else {
        pill.textContent = strongEnough ? `Detected: ${dispLabel}` : 'Position hand clearly';
        pill.classList.remove('success');
        holdCount = 0;
      }

    } else {
      pill.textContent = 'Show your hand';
      pill.classList.remove('ok', 'success');
      wrap.classList.remove('detecting', 'success');
      document.getElementById('confFill').style.width      = '0%';
      document.getElementById('confPct').textContent       = '0%';
      document.getElementById('detectedLabel').textContent = 'No sign detected';
      recentPreds.length = 0;
      holdCount = 0;
    }
  });

  const cam = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640,
    height: 480
  });
  cam.start();
}

render();
</script>
</body>
</html>
