<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara – Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-body: #fff0f6;
      --bg-card: #ffffff;
      --primary: #ff5fa2;
      --primary-hover: #d63384;
      --primary-light: #ffe6f2;
      --border: #fbcfe8;
      --text-main: #1f2937;
      --text-muted: #833a5c;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(255, 95, 162, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Card Container ── */
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      color: var(--primary);
    }

    .brand-title {
      font-family: 'Croissant One', cursive;
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 28px;
    }

    /* ── Toggle Switcher ── */
    .tab-switcher {
      background: var(--bg-body);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      display: flex;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--primary-hover);
      box-shadow: 0 2px 8px rgba(255, 95, 162, 0.15);
    }

    /* ── Form Controls ── */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 95, 162, 0.3);
      transition: background 0.15s ease, transform 0.1s ease;
      margin-top: 6px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* ── Divider & Guest Link ── */
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--border);
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .guest-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .guest-btn:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .error-box {
      background: #ffe4e6;
      color: #e11d48;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    
    <svg class="brand-icon" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2a2 2 0 012 2v7.17l.59-.58a2 2 0 012.83 2.83l-3.25 3.25A9 9 0 018 21a9 9 0 01-9-9c0-3.5 2-6.5 5-8v4.17l1.59-1.58a2 2 0 012.82 0L10 8.17V4a2 2 0 012-2z"/>
    </svg>

    <h1 class="brand-title">Ishara</h1>
    <p class="brand-tagline">Learn Indian Sign Language.</p>

    <div class="tab-switcher">
      <button class="tab-btn active" id="tabSignin" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form class="auth-form" onsubmit="handleAuth(event)">
      <input type="email" id="email" class="input-field" placeholder="Email address" required />
      <input type="password" id="password" class="input-field" placeholder="Password" required />
      <button type="submit" id="submitBtn" class="submit-btn">Sign In</button>
    </form>

    <div class="divider">
      <span>or</span>
    </div>

    <button class="guest-btn" onclick="continueAsGuest()">Continue without signing in</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mode = 'signin';

    function switchTab(targetMode) {
      mode = targetMode;
      const signinTab = document.getElementById('tabSignin');
      const signupTab = document.getElementById('tabSignup');
      const submitBtn = document.getElementById('submitBtn');
      
      hideError();

      if (mode === 'signin') {
        signinTab.classList.add('active');
        signupTab.classList.remove('active');
        submitBtn.innerText = 'Sign In';
      } else {
        signupTab.classList.add('active');
        signinTab.classList.remove('active');
        submitBtn.innerText = 'Sign Up';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      try {
        if (mode === 'signin') {
          const { error } = await _supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } else {
          const { error } = await _supabase.auth.signUp({ email, password });
          if (error) throw error;
        }

        window.location.href = 'learn.html';
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = mode === 'signin' ? 'Sign In' : 'Sign Up';
      }
    }

    function continueAsGuest() {
      localStorage.setItem('ishara_guest', 'true');
      window.location.href = 'learn.html';
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
    }
  </script>
</body>
</html>

```
