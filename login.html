<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishara</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-body: #fff0f6;
      --bg-card: #ffffff;
      --primary: #ff5fa2;
      --primary-hover: #d63384;
      --primary-light: #ffe6f2;
      --border: #fbcfe8;
      --text-main: #1f2937;
      --text-muted: #833a5c;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(255, 95, 162, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* ── Screen Containers ── */
    .screen {
      display: none;
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── 1. Splash Screen ── */
    #splashScreen {
      min-height: 80vh;
    }

    .brand-title-large {
      font-family: 'Croissant One', cursive;
      font-size: 3.2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .brand-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ── 2. Landing Screen ── */
    .landing-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    .landing-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 20px 0 32px;
    }

    /* ── 3. Auth & Terms Screen ── */
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    .tab-switcher {
      background: var(--bg-body);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      display: flex;
      margin-bottom: 24px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--primary-hover);
      box-shadow: 0 2px 8px rgba(255, 95, 162, 0.15);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .input-field {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    /* ── Checkboxes Section ── */
    .consent-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin: 8px 0 16px;
    }

    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      line-height: 1.4;
    }

    .checkbox-label input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      margin-top: 1px;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 95, 162, 0.3);
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--border);
      width: 100%;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .guest-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .guest-btn:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .error-box {
      background: #ffe4e6;
      color: #e11d48;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 14px;
      width: 100%;
      display: none;
    }
  </style>
</head>
<body>

  <div id="splashScreen" class="screen active">
    <h1 class="brand-title-large">Ishara</h1>
    <p class="brand-subtitle">Indian Sign Language Learning</p>
  </div>

  <div id="landingScreen" class="screen">
    <div class="landing-card">
      <h1 class="brand-title-large" style="font-size: 2.5rem;">Ishara</h1>
      <p class="landing-desc">Master Indian Sign Language through interactive lessons and live camera practice.</p>
      <button class="btn-primary" onclick="goToAuth()">Get Started</button>
    </div>
  </div>

  <div id="authScreen" class="screen">
    <div class="auth-card">
      <h1 class="brand-title-large" style="font-size: 2rem; margin-bottom: 16px;">Ishara</h1>

      <div class="tab-switcher">
        <button class="tab-btn active" id="tabSignin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div class="error-box" id="errorBox"></div>

      <form class="auth-form" onsubmit="handleAuth(event)">
        <input type="email" id="email" class="input-field" placeholder="Email address" required />
        <input type="password" id="password" class="input-field" placeholder="Password" required />

        <div class="consent-group">
          <label class="checkbox-label">
            <input type="checkbox" id="checkAge" onchange="validateConsent()" />
            I confirm that I am at least 13 years old.
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="checkTerms" onchange="validateConsent()" />
            I agree to the Terms of Service and Privacy Policy.
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" disabled>Sign In</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <button class="guest-btn" onclick="continueAsGuest()">Continue without signing in</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xxijjaiytnqrdbqjegjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aWpqYWl5dG5xcmRicWplZ2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxODEzNzQsImV4cCI6MjA4Nzc1NzM3NH0.Vx5B2bmtGgkE7laaQtfdbhUodWB_CqLwfJEFgy6eSn8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mode = 'signin';

    // ── STEP FLOW MANAGEMENT ──
    window.addEventListener('DOMContentLoaded', () => {
      // Auto transition from Splash Screen to Landing Page after 1.8 seconds
      setTimeout(() => {
        document.getElementById('splashScreen').classList.remove('active');
        document.getElementById('landingScreen').classList.add('active');
      }, 1800);
    });

    function goToAuth() {
      document.getElementById('landingScreen').classList.remove('active');
      document.getElementById('authScreen').classList.add('active');
    }

    // ── FORM CONSENT VALIDATION ──
    function validateConsent() {
      const ageChecked = document.getElementById('checkAge').checked;
      const termsChecked = document.getElementById('checkTerms').checked;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = !(ageChecked && termsChecked);
    }

    function switchTab(targetMode) {
      mode = targetMode;
      const signinTab = document.getElementById('tabSignin');
      const signupTab = document.getElementById('tabSignup');
      const submitBtn = document.getElementById('submitBtn');
      
      hideError();

      if (mode === 'signin') {
        signinTab.classList.add('active');
        signupTab.classList.remove('active');
        submitBtn.innerText = 'Sign In';
      } else {
        signupTab.classList.add('active');
        signinTab.classList.remove('active');
        submitBtn.innerText = 'Sign Up';
      }
    }

    // ── FIXED SUPABASE AUTH ──
    async function handleAuth(e) {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      try {
        if (mode === 'signin') {
          const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
        } else {
          const { data, error } = await _supabase.auth.signUp({ email, password });
          if (error) throw error;
        }

        window.location.href = 'learn.html';
      } catch (err) {
        showError(err.message || 'Authentication failed. Please try again.');
        submitBtn.disabled = false;
        validateConsent();
      }
    }

    function continueAsGuest() {
      const ageChecked = document.getElementById('checkAge').checked;
      const termsChecked = document.getElementById('checkTerms').checked;

      if (!ageChecked || !termsChecked) {
        showError('Please check both boxes to confirm your age and accept terms before continuing.');
        return;
      }

      localStorage.setItem('ishara_guest', 'true');
      window.location.href = 'learn.html';
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
    }
  </script>
</body>
</html>
