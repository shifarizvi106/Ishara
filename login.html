<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignPath – Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: white; border-radius: 28px;
      padding: 40px 28px; width: 100%; max-width: 360px;
      box-shadow: 0 12px 40px rgba(255,95,162,0.15);
      display: flex; flex-direction: column;
      align-items: center; gap: 20px; text-align: center;
    }
    .login-logo { font-size: 2.2rem; font-weight: 900; color: #d63384; }
    .login-sub  { font-size: 0.88rem; color: #a14a76; line-height: 1.6; }
    .login-emoji { font-size: 4rem; }

    .google-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%;
      background: white; border: 2.5px solid #f4b6d2;
      border-radius: 999px; padding: 14px 20px;
      font-size: 0.95rem; font-weight: 700; color: #3a2a33;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .google-btn:hover {
      border-color: #ff5fa2;
      box-shadow: 0 4px 16px rgba(255,95,162,0.2);
    }
    .google-btn img { width: 20px; height: 20px; }

    .divider {
      width: 100%; display: flex; align-items: center; gap: 10px;
      font-size: 0.75rem; color: #c77aa0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #f4b6d2;
    }

    .skip-btn {
      font-size: 0.82rem; color: #c77aa0; cursor: pointer;
      background: none; border: none; font-weight: 600;
    }
    .skip-btn:hover { color: #d63384; }

    .loading {
      display: none; font-size: 0.88rem; color: #a14a76; font-weight: 600;
    }
  </style>
</head>
<body>

<div class="login-card">
  
  <div class="login-logo">SignPath</div>
  <p class="login-sub">Learn Indian Sign Language.<br>Sign in to save your progress across devices!</p>

  <button class="google-btn" onclick="signInWithGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Continue with Google
  </button>

  <div class="divider">or</div>

  <button class="skip-btn" onclick="skipLogin()">Continue without signing in</button>

  <div class="loading" id="loading">Signing in...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAR8k7CscuvbbIGAhkCtvNSXDN3Cf1M6k",
    authDomain: "signpath-85bd3.firebaseapp.com",
    projectId: "signpath-85bd3",
    storageBucket: "signpath-85bd3.firebasestorage.app",
    messagingSenderId: "619265262922",
    appId: "1:619265262922:web:8c294ff2799a8067012db3"
  };

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  // If already logged in, skip straight to learn
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'learn.html';
  });

  window.signInWithGoogle = async () => {
    document.getElementById('loading').style.display = 'block';
    try {
      await signInWithPopup(auth, provider);
      // onAuthStateChanged will redirect
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      alert('Sign in failed: ' + e.message);
    }
  };

  window.skipLogin = () => {
    localStorage.setItem('sp_guest', '1');
    window.location.href = 'learn.html';
  };
</script>
</body>
</html>
